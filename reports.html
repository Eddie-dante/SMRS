<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Reports & Analytics</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        .content-section {
            padding: 30px;
            margin-top: 60px;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .page-title h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .stat-card i {
            font-size: 35px;
            margin-bottom: 15px;
        }
        
        .stat-card .value {
            font-size: 2.5em;
            font-weight: 900;
            color: #ffffff;
            margin: 10px 0;
        }
        
        .stat-card .label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
        }
        
        .chart-container h3 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .chart-container h3 i {
            color: #d4af37;
        }
        
        .chart-container canvas {
            max-height: 300px;
        }
    </style>
</head>
<body>
    <!-- Taskbar -->
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="taskbar-logo">
                <i class="fas fa-school"></i>
                <span>SRMS</span>
            </div>
        </div>
        <div class="taskbar-center">
            <button class="taskbar-btn" onclick="location.href='dashboard.html'">
                <i class="fas fa-home"></i> Dashboard
            </button>
            <button class="taskbar-btn" onclick="location.href='library.html'">
                <i class="fas fa-book"></i> Library
            </button>
            <button class="taskbar-btn" onclick="location.href='students.html'">
                <i class="fas fa-users"></i> Students
            </button>
            <button class="taskbar-btn" onclick="location.href='furniture.html'">
                <i class="fas fa-chair"></i> Furniture
            </button>
            <button class="taskbar-btn active" onclick="location.href='reports.html'">
                <i class="fas fa-file-alt"></i> Reports
            </button>
            <button class="taskbar-btn" onclick="location.href='settings.html'">
                <i class="fas fa-cog"></i> Settings
            </button>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" onclick="toggleWallpaperPanel()" title="Change Wallpaper">
                <i class="fas fa-image"></i>
            </button>
            <button class="taskbar-icon-btn" onclick="logout()" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="content-section">
        <!-- Page Header -->
        <div class="page-header">
            <div class="page-title">
                <h1>Reports & Analytics</h1>
                <p>View statistics and insights</p>
            </div>
            <button class="btn btn-primary" onclick="exportReport()">
                <i class="fas fa-download"></i> Export Report
            </button>
        </div>
        
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-clock" style="color: #dc3545;"></i>
                <div class="value" id="overdueCount">0</div>
                <div class="label">Overdue Books</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-exchange-alt" style="color: #17a2b8;"></i>
                <div class="value" id="activeLoansCount">0</div>
                <div class="label">Active Loans</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-check-circle" style="color: #28a745;"></i>
                <div class="value" id="returnRate">0%</div>
                <div class="label">Return Rate</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-chair" style="color: #ffc107;"></i>
                <div class="value" id="furnitureCount">0</div>
                <div class="label">Active Furniture</div>
            </div>
        </div>
        
        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-container">
                <h3><i class="fas fa-book"></i> Books by Type</h3>
                <canvas id="booksByTypeChart"></canvas>
            </div>
            <div class="chart-container">
                <h3><i class="fas fa-users"></i> Students by Form</h3>
                <canvas id="studentsByFormChart"></canvas>
            </div>
            <div class="chart-container">
                <h3><i class="fas fa-chair"></i> Furniture Distribution</h3>
                <canvas id="furnitureChart"></canvas>
            </div>
            <div class="chart-container">
                <h3><i class="fas fa-clock"></i> Borrowing Trends</h3>
                <canvas id="borrowingTrendChart"></canvas>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/wallpaper.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
