<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Reports & Analytics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Taskbar -->
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="taskbar-logo"><i class="fas fa-school"></i><span>SRMS</span></div>
        </div>
        <div class="taskbar-center">
            <button class="taskbar-btn" onclick="location.href='dashboard.html'"><i class="fas fa-home"></i> Dashboard</button>
            <button class="taskbar-btn" onclick="location.href='library.html'"><i class="fas fa-book"></i> Library</button>
            <button class="taskbar-btn" onclick="location.href='students.html'"><i class="fas fa-users"></i> Students</button>
            <button class="taskbar-btn" onclick="location.href='furniture.html'"><i class="fas fa-chair"></i> Furniture</button>
            <button class="taskbar-btn" onclick="location.href='chat.html'"><i class="fas fa-comments"></i> Chat</button>
            <button class="taskbar-btn active" onclick="location.href='reports.html'"><i class="fas fa-file-alt"></i> Reports</button>
            <button class="taskbar-btn" onclick="location.href='settings.html'"><i class="fas fa-cog"></i> Settings</button>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" onclick="location.href='wallpaper.html'" title="Change Wallpaper"><i class="fas fa-image"></i></button>
            <button class="taskbar-icon-btn" onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="content-section">
        <div class="page-header">
            <div class="page-title">
                <h1>Reports & Analytics</h1>
                <p>View statistics and insights</p>
            </div>
            <button class="btn btn-primary" onclick="exportReport()">
                <i class="fas fa-download"></i> Export Report
            </button>
        </div>
        
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(220, 53, 69, 0.15); color: #dc3545;">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-value" id="overdueCount">0</div>
                <div class="stat-label">Overdue Books</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(23, 162, 184, 0.15); color: #17a2b8;">
                    <i class="fas fa-exchange-alt"></i>
                </div>
                <div class="stat-value" id="activeLoansCount">0</div>
                <div class="stat-label">Active Loans</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(40, 167, 69, 0.15); color: #28a745;">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-value" id="returnRate">0%</div>
                <div class="stat-label">Return Rate</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(255, 193, 7, 0.15); color: #ffc107;">
                    <i class="fas fa-chair"></i>
                </div>
                <div class="stat-value" id="furnitureCount">0</div>
                <div class="stat-label">Active Furniture</div>
            </div>
        </div>
        
        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-container">
                <h3><i class="fas fa-book"></i> Books by Type</h3>
                <canvas id="booksByTypeChart"></canvas>
            </div>
            <div class="chart-container">
                <h3><i class="fas fa-users"></i> Students by Form</h3>
                <canvas id="studentsByFormChart"></canvas>
            </div>
            <div class="chart-container">
                <h3><i class="fas fa-chair"></i> Furniture Distribution</h3>
                <canvas id="furnitureChart"></canvas>
            </div>
            <div class="chart-container">
                <h3><i class="fas fa-clock"></i> Borrowing Trends</h3>
                <canvas id="borrowingTrendChart"></canvas>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/wallpaper-loader.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        function exportReport() {
            showNotification('Report exported successfully!', 'success');
        }
    </script>
</body>
</html>
