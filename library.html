<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Library Management</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="fas fa-school"></i>
                <span>SRMS</span>
            </div>
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a href="library.html" class="nav-item active">
                <i class="fas fa-book"></i>
                <span>Library</span>
            </a>
            <a href="students.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span>Students</span>
            </a>
            <a href="furniture.html" class="nav-item">
                <i class="fas fa-chair"></i>
                <span>Furniture</span>
            </a>
            <a href="reports.html" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Reports</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-details">
                    <div class="user-name" id="userName">User</div>
                    <div class="user-role" id="userRole">Role</div>
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <h1>Library Management</h1>
                <p class="date-display" id="dateDisplay"></p>
            </div>
            <div class="top-bar-right">
                <button class="btn btn-primary" onclick="openAddBookModal()">
                    <i class="fas fa-plus"></i> Add Book
                </button>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('catalog')">
                <i class="fas fa-list"></i> Catalog
            </button>
            <button class="tab" onclick="switchTab('issue')">
                <i class="fas fa-book"></i> Issue Books
            </button>
            <button class="tab" onclick="switchTab('returns')">
                <i class="fas fa-undo"></i> Returns
            </button>
            <button class="tab" onclick="switchTab('borrowed')">
                <i class="fas fa-clock"></i> Borrowed
            </button>
        </div>
        
        <!-- Catalog Tab -->
        <div id="catalogTab" class="tab-content active">
            <div class="search-bar glass">
                <i class="fas fa-search"></i>
                <input type="text" id="searchBooks" placeholder="Search books by title, author, or subject..." onkeyup="filterBooks()">
            </div>
            
            <div class="table-container glass">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Type</th>
                            <th>Subject</th>
                            <th>Quantity</th>
                            <th>Available</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="booksTableBody">
                        <!-- Books will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Issue Tab -->
        <div id="issueTab" class="tab-content">
            <div class="form-container glass">
                <h2>Issue Book</h2>
                <form id="issueBookForm" onsubmit="issueBook(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Student Name</label>
                            <input type="text" id="issueStudentName" required>
                        </div>
                        <div class="form-group">
                            <label>ADM Number</label>
                            <input type="text" id="issueADM" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Book Title</label>
                            <select id="issueBookTitle" required>
                                <option value="">Select Book</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Book Number</label>
                            <input type="text" id="issueBookNumber" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Borrow Date</label>
                            <input type="date" id="issueBorrowDate" required>
                        </div>
                        <div class="form-group">
                            <label>Return Date</label>
                            <input type="date" id="issueReturnDate" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-book"></i> Issue Book
                    </button>
                </form>
            </div>
        </div>
        
        <!-- Returns Tab -->
        <div id="returnsTab" class="tab-content">
            <div class="search-bar glass">
                <i class="fas fa-search"></i>
                <input type="text" id="searchReturns" placeholder="Search by student name or book..." onkeyup="filterReturns()">
            </div>
            
            <div class="table-container glass">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>ADM</th>
                            <th>Book</th>
                            <th>Book No</th>
                            <th>Borrow Date</th>
                            <th>Due Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="returnsTableBody">
                        <!-- Active loans will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Borrowed Tab -->
        <div id="borrowedTab" class="tab-content">
            <div class="table-container glass">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Book</th>
                            <th>Borrow Date</th>
                            <th>Return Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="borrowedTableBody">
                        <!-- All borrowed records will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Add Book Modal -->
    <div class="modal" id="addBookModal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2>Add New Book</h2>
                <button class="modal-close" onclick="closeModal('addBookModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="addBookForm" onsubmit="addBook(event)">
                <div class="form-group">
                    <label>Book Title</label>
                    <input type="text" id="bookTitle" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Author</label>
                        <input type="text" id="bookAuthor">
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="bookType">
                            <option value="Textbook">Textbook</option>
                            <option value="Novel">Novel</option>
                            <option value="Reference">Reference</option>
                            <option value="Magazine">Magazine</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="bookSubject">
                    </div>
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" id="bookQuantity" min="1" value="1" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-plus"></i> Add Book
                </button>
            </form>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
