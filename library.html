<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Library Management</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Taskbar -->
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="taskbar-logo"><i class="fas fa-school"></i><span>SRMS</span></div>
        </div>
        <div class="taskbar-center">
            <button class="taskbar-btn" onclick="location.href='dashboard.html'"><i class="fas fa-home"></i> Dashboard</button>
            <button class="taskbar-btn active" onclick="location.href='library.html'"><i class="fas fa-book"></i> Library</button>
            <button class="taskbar-btn" onclick="location.href='students.html'"><i class="fas fa-users"></i> Students</button>
            <button class="taskbar-btn" onclick="location.href='furniture.html'"><i class="fas fa-chair"></i> Furniture</button>
            <button class="taskbar-btn" onclick="location.href='chat.html'"><i class="fas fa-comments"></i> Chat</button>
            <button class="taskbar-btn" onclick="location.href='reports.html'"><i class="fas fa-file-alt"></i> Reports</button>
            <button class="taskbar-btn" onclick="location.href='settings.html'"><i class="fas fa-cog"></i> Settings</button>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" onclick="location.href='wallpaper.html'" title="Change Wallpaper"><i class="fas fa-image"></i></button>
            <button class="taskbar-icon-btn" onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="content-section">
        <div class="page-header">
            <div class="page-title">
                <h1>Library Management</h1>
                <p>Manage books, issue, and returns</p>
            </div>
            <button class="btn btn-primary" onclick="openModal('addBookModal')">
                <i class="fas fa-plus"></i> Add Book
            </button>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('catalog')"><i class="fas fa-list"></i> Catalog</button>
            <button class="tab" onclick="switchTab('issue')"><i class="fas fa-book"></i> Issue Books</button>
            <button class="tab" onclick="switchTab('returns')"><i class="fas fa-undo"></i> Returns</button>
            <button class="tab" onclick="switchTab('borrowed')"><i class="fas fa-clock"></i> Borrowed</button>
        </div>
        
        <!-- Catalog Tab -->
        <div id="catalogTab" class="tab-content active">
            <div class="search-bar glass">
                <i class="fas fa-search"></i>
                <input type="text" id="searchBooks" placeholder="Search books..." onkeyup="filterBooks()">
            </div>
            <div class="table-container glass">
                <table class="data-table">
                    <thead>
                        <tr><th>Title</th><th>Author</th><th>Type</th><th>Subject</th><th>Quantity</th><th>Available</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="booksTableBody"></tbody>
                </table>
            </div>
        </div>
        
        <!-- Issue Tab -->
        <div id="issueTab" class="tab-content">
            <div class="form-container glass">
                <h3><i class="fas fa-book"></i> Issue Book</h3>
                <form id="issueBookForm" onsubmit="issueBook(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Student Name</label>
                            <input type="text" id="issueStudentName" required>
                        </div>
                        <div class="form-group">
                            <label>ADM Number</label>
                            <input type="text" id="issueADM" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Book Title</label>
                            <select id="issueBookTitle" required><option value="">Select Book</option></select>
                        </div>
                        <div class="form-group">
                            <label>Book Number</label>
                            <input type="text" id="issueBookNumber" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Borrow Date</label>
                            <input type="date" id="issueBorrowDate" required>
                        </div>
                        <div class="form-group">
                            <label>Return Date</label>
                            <input type="date" id="issueReturnDate" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-book"></i> Issue Book
                    </button>
                </form>
            </div>
        </div>
        
        <!-- Returns Tab -->
        <div id="returnsTab" class="tab-content">
            <div class="table-container glass">
                <table class="data-table">
                    <thead>
                        <tr><th>Student</th><th>ADM</th><th>Book</th><th>Book No</th><th>Due Date</th><th>Status</th><th>Action</th></tr>
                    </thead>
                    <tbody id="returnsTableBody"></tbody>
                </table>
            </div>
        </div>
        
        <!-- Borrowed Tab -->
        <div id="borrowedTab" class="tab-content">
            <div class="table-container glass">
                <table class="data-table">
                    <thead>
                        <tr><th>Student</th><th>Book</th><th>Borrow Date</th><th>Return Date</th><th>Status</th></tr>
                    </thead>
                    <tbody id="borrowedTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Add Book Modal -->
    <div class="modal" id="addBookModal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2><i class="fas fa-plus"></i> Add New Book</h2>
                <button class="modal-close" onclick="closeModal('addBookModal')"><i class="fas fa-times"></i></button>
            </div>
            <form id="addBookForm" onsubmit="addBook(event)">
                <div class="form-group">
                    <label>Book Title</label>
                    <input type="text" id="bookTitle" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Author</label>
                        <input type="text" id="bookAuthor">
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="bookType">
                            <option>Textbook</option><option>Novel</option><option>Reference</option><option>Magazine</option><option>Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="bookSubject">
                    </div>
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" id="bookQuantity" min="1" value="1" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-plus"></i> Add Book
                </button>
            </form>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/wallpaper-loader.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // Set default dates
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('issueBorrowDate').value = getCurrentDate();
            document.getElementById('issueReturnDate').value = addDays(getCurrentDate(), 14);
        });
    </script>
</body>
</html>
