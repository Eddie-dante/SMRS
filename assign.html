<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRMS - Assign Item | School Resource Management System</title>

    <meta name="theme-color" content="#0a0e27">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --primary: #e94560;
            --accent: #d4af37;
            --gold: #f0d060;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 120px;
        }
        
        .taskbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px;
        }
        .taskbar-logo { display: flex; align-items: center; gap: 8px; color: var(--gold); font-weight: 900; font-size: 20px; text-decoration: none; }
        .taskbar-logo i { font-size: 22px; }
        .taskbar-right { display: flex; gap: 6px; }
        .taskbar-icon-btn {
            width: 35px; height: 35px; border-radius: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--accent); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; transition: var(--transition);
        }
        .taskbar-icon-btn:hover { background: rgba(212, 175, 55, 0.2); color: #fff; }
        
        .floating-navbar-container {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: auto; max-width: 95vw;
        }
        .floating-navbar {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 10px 15px;
            background: rgba(15, 18, 30, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            flex-wrap: wrap;
        }
        .nav-group { position: relative; display: inline-block; }
        .classy-btn {
            font-family: 'Cinzel', serif;
            font-size: 11px; font-weight: 600;
            color: #f0e6d2;
            background: linear-gradient(135deg, rgba(35, 30, 25, 0.85), rgba(10, 8, 5, 0.95));
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 25px;
            padding: 8px 14px;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: var(--transition);
        }
        .classy-btn i { color: var(--accent); font-size: 12px; }
        .classy-btn:hover { color: #fff; transform: translateY(-2px); border-color: var(--gold); }
        .classy-btn.active {
            background: linear-gradient(135deg, rgba(80, 60, 25, 0.9), rgba(30, 20, 5, 0.95));
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .btn-badge {
            width: 22px; height: 22px; border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.25), rgba(0,0,0,0.4));
            border: 1px solid rgba(212,175,55,0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px;
        }
        .dropdown-menu {
            display: none;
            position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
            background: rgba(10, 14, 39, 0.98);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px; padding: 8px; min-width: 180px;
            z-index: 1200; box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .dropdown-menu::before { content: ""; position: absolute; top: -15px; left: 0; right: 0; height: 15px; background: transparent; }
        .dropdown-menu.open { display: block !important; }
        .nav-group:hover .dropdown-menu, .dropdown-menu:hover { display: block !important; }
        .dropdown-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; color: rgba(255,255,255,0.8);
            text-decoration: none; border-radius: 6px;
            font-size: 11px; cursor: pointer; white-space: nowrap;
            transition: var(--transition);
        }
        .dropdown-item i { color: var(--accent); width: 16px; font-size: 11px; }
        .dropdown-item:hover { background: rgba(212, 175, 55, 0.15); color: #fff; }
        .dropdown-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 4px 0; }
        
        .main-content {
            padding: 75px 20px 20px;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-header { margin-bottom: 20px; text-align: center; }
        .page-header h1 {
            font-size: 1.5em; font-weight: 900;
            background: linear-gradient(180deg, #fff, #d4af37);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p { color: rgba(255,255,255,0.6); font-size: 12px; }
        
        .btn {
            padding: 10px 16px; border: none; border-radius: 8px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            font-family: 'Inter', sans-serif; transition: var(--transition);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: linear-gradient(135deg, #e94560, #c62a47); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #28a745, #20c997); color: #fff; }
        
        .panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        .student-info-banner {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }
        .student-info-banner .name { font-size: 1.1em; font-weight: 800; color: var(--gold); }
        .student-info-banner .adm { font-size: 0.8em; color: rgba(255,255,255,0.6); }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 11px; color: rgba(255,255,255,0.7); }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px; color: #fff;
            font-family: 'Inter', sans-serif; font-size: 14px;
        }
        .form-group select option { background: #1a1f4e; }
        .form-group input:disabled {
            opacity: 0.7;
            background: rgba(255,255,255,0.02);
            cursor: not-allowed;
        }
        
        .success-message {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            display: none;
        }
        .success-message i { font-size: 40px; color: #34ce57; margin-bottom: 10px; }
        .success-message h3 { color: #34ce57; margin-bottom: 5px; }
        
        @media (max-width: 768px) {
            .floating-navbar { padding: 6px 8px; gap: 4px; }
            .classy-btn { padding: 6px 8px; font-size: 9px; }
            .main-content { padding: 65px 15px 15px; }
        }
    </style>
</head>
<body>
    <div class="taskbar">
        <div class="taskbar-left">
            <a href="dashboard.html" class="taskbar-logo"><i class="fas fa-school"></i><span>SRMS</span></a>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" title="Wallpaper" onclick="location.href='wallpaper.html'"><i class="fas fa-image"></i></button>
            <button class="taskbar-icon-btn" title="Logout" onclick="logoutWithConfirm()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-box"></i> Assign Item</h1>
            <p>Assign books, furniture, or any item to a student</p>
        </div>
        
        <div class="student-info-banner" id="studentInfoBanner">
            <div class="name" id="bannerName">Student Name</div>
            <div class="adm" id="bannerAdm">ADM: -</div>
        </div>
        
        <div class="panel" id="assignFormPanel">
            <form onsubmit="return assignItemForm(event)">
                <div class="form-group">
                    <label>👤 Student Name (Auto-filled)</label>
                    <input type="text" id="assignName" readonly>
                </div>
                <div class="form-group">
                    <label>🔢 Admission Number (Auto-filled)</label>
                    <input type="text" id="assignAdm" readonly>
                </div>
                <div class="form-group">
                    <label>📦 Item Type *</label>
                    <select id="assignItemType" required>
                        <option value="">-- Select item type --</option>
                        <option value="book">📚 Book</option>
                        <option value="chair">🪑 Chair</option>
                        <option value="locker">🔒 Locker</option>
                        <option value="labcoat">🥼 Lab Coat</option>
                        <option value="calculator">🧮 Calculator</option>
                        <option value="laptop">💻 Laptop</option>
                        <option value="tablet">📱 Tablet</option>
                        <option value="sports">⚽ Sports Equipment</option>
                        <option value="instrument">🎻 Musical Instrument</option>
                        <option value="uniform">👔 Uniform</option>
                        <option value="other">📦 Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>🔢 Item Number/ID *</label>
                    <input type="text" id="assignItemNo" placeholder="e.g., CH-001, BK-123, LK-456" required>
                </div>
                <div class="form-group">
                    <label>📝 Notes (Optional)</label>
                    <input type="text" id="assignNotes" placeholder="Any additional notes...">
                </div>
                <button type="submit" class="btn btn-success" style="width:100%;justify-content:center;">
                    <i class="fas fa-check"></i> Assign Item
                </button>
            </form>
        </div>
        
        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i>
            <h3>Item Assigned Successfully!</h3>
            <p id="successDetails"></p>
            <button class="btn btn-primary" onclick="assignAnother()" style="margin-top:15px;">
                <i class="fas fa-plus"></i> Assign Another Item
            </button>
            <button class="btn btn-secondary" onclick="location.href='qrcodes.html'" style="margin-top:8px;">
                <i class="fas fa-qrcode"></i> Back to QR Codes
            </button>
        </div>
    </div>
    
    <div class="floating-navbar-container">
        <div class="floating-navbar">
            <button class="classy-btn" onclick="location.href='dashboard.html'">

            <div class="nav-group">

                </button>
                <div class="dropdown-menu">

                </div>
            </div>
            <div class="nav-group">
                <button class="classy-btn">
                    <span class="btn-badge"><i class="fas fa-user-friends"></i></span> People <i class="fas fa-chevron-up"></i>
                </button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="students.html"><i class="fas fa-user-graduate"></i> Students</a>
                    <a class="dropdown-item" href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> Teachers</a>
                    <a class="dropdown-item" href="classes.html"><i class="fas fa-door-open"></i> Classes</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" href="StudentsIDs.html"><i class="fas fa-id-card"></i> Student IDs</a>
                </div>
            </div>
            <div class="nav-group">
                <button class="classy-btn">
                    <span class="btn-badge"><i class="fas fa-comments"></i></span> Comms <i class="fas fa-chevron-up"></i>
                </button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="chat.html"><i class="fas fa-comment-dots"></i> Chat</a>
                    <a class="dropdown-item" href="forum.html"><i class="fas fa-bullhorn"></i> Forum</a>

            </div>

                    <a class="dropdown-item" href="auditlog.html"><i class="fas fa-history"></i> Audit</a>
                    <a class="dropdown-item" href="database.html"><i class="fas fa-database"></i> DB</a>

    <script src="js/api.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/utils.js"></script>

    <script src="js/app.js"></script>
    
    <script>
        var scannedStudentAdm = '';
        var scannedStudentName = '';
        
        document.addEventListener('DOMContentLoaded', function() {
            loadStudentFromURL();
        });
        
        function loadStudentFromURL() {
            var params = new URLSearchParams(window.location.search);
            scannedStudentAdm = params.get('adm') || '';
            scannedStudentName = params.get('name') || '';
            
            if (scannedStudentAdm || scannedStudentName) {
                document.getElementById('assignName').value = scannedStudentName;
                document.getElementById('assignAdm').value = scannedStudentAdm;
                document.getElementById('bannerName').textContent = scannedStudentName || 'Student';
                document.getElementById('bannerAdm').textContent = 'ADM: ' + (scannedStudentAdm || '-');
                
                showNotification('Student details loaded!', 'success');
            } else {
                // No student data - show message
                document.getElementById('bannerName').textContent = 'No student selected';
                document.getElementById('bannerAdm').textContent = 'Scan a QR code first';
            }
        }
        
        function assignItemForm(event) {
            event.preventDefault();
            
            var school = getCurrentSchool();
            var user = getCurrentUser();
            var name = document.getElementById('assignName').value.trim();
            var adm = document.getElementById('assignAdm').value.trim();
            var itemType = document.getElementById('assignItemType').value;
            var itemNo = document.getElementById('assignItemNo').value.trim();
            var notes = document.getElementById('assignNotes').value.trim();
            
            if (!name) { showNotification('Student name is required', 'warning'); return false; }
            if (!adm) { showNotification('Admission number is required', 'warning'); return false; }
            if (!itemType) { showNotification('Select item type', 'warning'); return false; }
            if (!itemNo) { showNotification('Enter item number', 'warning'); return false; }
            
            API.assignItem(school, {
                studentName: name,
                adm: adm,
                itemType: itemType,
                itemNo: itemNo,
                assignedBy: user ? user.name : ''
            }).then(function(result) {
                if (result.success) {
                    // Show success message
                    document.getElementById('assignFormPanel').style.display = 'none';
                    document.getElementById('studentInfoBanner').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('successDetails').textContent = 
                        itemType.toUpperCase() + ' ' + itemNo + ' assigned to ' + name + ' (' + adm + ')';
                    
                    if (typeof logAction === 'function') {
                        logAction('Item Assigned', itemType + ' ' + itemNo + ' to ' + name);
                    }
                    
                    showNotification('Item assigned successfully!', 'success');
                } else {
                    showNotification(result.error || 'Failed to assign', 'error');
                }
            }).catch(function() {
                showNotification('Failed to assign item', 'error');
            });
            
            return false;
        }
        
        function assignAnother() {
            document.getElementById('assignFormPanel').style.display = 'block';
            document.getElementById('studentInfoBanner').style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('assignItemType').value = '';
            document.getElementById('assignItemNo').value = '';
            document.getElementById('assignNotes').value = '';
        }
        
        function showNotification(message, type) {
            var existingToast = document.querySelector('.toast-notification');
            if (existingToast) existingToast.remove();
            
            var toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.style.cssText = 'position:fixed;top:20px;right:20px;padding:14px 20px;border-radius:10px;color:#fff;z-index:9999;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,0.5);transition:opacity 0.3s;';
            var colors = { success: '#28a745', error: '#dc3545', warning: '#ffc107', info: '#17a2b8' };
            toast.style.background = colors[type] || colors.info;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                setTimeout(function() { if (toast.parentNode) toast.remove(); }, 300);
            }, 2500);
        }
        
        function logoutWithConfirm() {
            if (typeof DialogSystem !== 'undefined' && DialogSystem.confirm) {
                DialogSystem.confirm('Logout?', { title: 'Logout', type: 'info', confirmText: 'Logout', cancelText: 'Cancel' }).then(function(result) {
                    if (result === 'confirm') logout();
                });
            } else {
                if (confirm('Logout?')) logout();
            }
        }
        
        function logout() {
            localStorage.removeItem('srms_user');
            localStorage.removeItem('srms_school');
            window.location.href = 'index.html';
        }
        
        window.assignItemForm = assignItemForm;
        window.assignAnother = assignAnother;
        window.logoutWithConfirm = logoutWithConfirm;
        window.logout = logout;
    </script>
</body>
