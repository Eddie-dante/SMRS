<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Login | School Resource Management System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        :root {
            --primary: #e94560;
            --primary-dark: #c62a47;
            --accent: #d4af37;
            --gold: #f0d060;
            --dark: #0a0e27;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
            padding: 20px;
        }
        
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            background: rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            animation: float 15s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-100px) rotate(180deg); }
        }
        
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 850px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .brand-panel {
            background: rgba(10, 14, 39, 0.5);
            backdrop-filter: blur(10px);
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .brand-logo {
            width: 90px; height: 90px;
            background: linear-gradient(135deg, #d4af37, #f0d060);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: 900;
            color: #0a0e27;
            margin-bottom: 18px;
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.4);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .brand-title {
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(180deg, #f0d060, #d4af37);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .brand-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
            margin-bottom: 12px;
        }
        
        .brand-by { color: #d4af37; font-size: 0.8em; font-weight: 600; }
        
        .brand-features {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .brand-feature {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }
        
        .brand-feature i { color: #d4af37; }
        
        .form-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .form-header h2 {
            color: #ffffff;
            font-size: 1.7em;
            font-weight: 800;
            margin-bottom: 6px;
        }
        
        .form-header p { color: rgba(255, 255, 255, 0.5); font-size: 13px; }
        
        .form-group { margin-bottom: 18px; }
        
        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
        }
        
        .form-group label i { margin-right: 6px; color: #d4af37; }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }
        
        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #e94560, #c62a47);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.6);
        }
        
        .login-footer {
            text-align: center;
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .login-footer a {
            color: rgba(212, 175, 55, 0.8);
            text-decoration: none;
            font-size: 12px;
        }
        
        .back-link {
            position: fixed;
            top: 20px; left: 20px;
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
            z-index: 10;
        }
        
        .error-message {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff4757;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 13px;
        }
        
        .error-message.show { display: block; }
        
        @media (max-width: 768px) {
            .login-container { grid-template-columns: 1fr; }
            .brand-panel { display: none; }
        }
    </style>
</head>
<body>
    <a href="landing.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    
    <div class="particles" id="particles"></div>
    
    <div class="login-container">
        <div class="brand-panel">
            <div class="brand-logo"><i class="fas fa-school"></i></div>
            <div class="brand-title">SRMS</div>
            <div class="brand-subtitle">School Resource Management System</div>
            <div class="brand-by">by <strong>WeGEM</strong></div>
            <div class="brand-features">
                <div class="brand-feature"><i class="fas fa-check-circle"></i> Library Management</div>
                <div class="brand-feature"><i class="fas fa-check-circle"></i> Student Database</div>
                <div class="brand-feature"><i class="fas fa-check-circle"></i> Furniture Allocation</div>
            </div>
        </div>
        
        <div class="form-panel" id="formPanel">
            <div class="form-header">
                <h2>Welcome Back!</h2>
                <p>Login to your account</p>
            </div>
            
            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>
            
            <form onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label><i class="fas fa-school"></i> School Name</label>
                    <input type="text" id="schoolName" placeholder="Enter school name" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <div class="login-footer">
                <a href="#" onclick="showSignup(event)"><i class="fas fa-user-plus"></i> Sign Up</a>
                <a href="#" onclick="showForgotPassword(event)"><i class="fas fa-key"></i> Forgot Password?</a>
                <a href="#" onclick="showCreateSchool(event)"><i class="fas fa-plus-circle"></i> Create School</a>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/wallpaper-loader.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var container = document.getElementById('particles');
            for (var i = 0; i < 30; i++) {
                var particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 4 + 1 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 10 + 10 + 's';
                container.appendChild(particle);
            }
        });
    </script>
</body>
</html>
