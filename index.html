<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRMS - Login | School Resource Management System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #e94560;
            --primary-dark: #c62a47;
            --accent: #d4af37;
            --gold: #f0d060;
            --dark: #0a0e27;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
            padding: 20px;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            animation: float 15s infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-100px) rotate(180deg); }
        }
        
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-logo { text-align: center; margin-bottom: 30px; }
        .login-logo .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #d4af37, #f0d060);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            color: #0a0e27;
            margin: 0 auto 15px;
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.3);
        }
        .login-logo h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(180deg, #f0d060, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-logo p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-top: 4px;
        }
        
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
        }
        .form-group label i { margin-right: 8px; color: #d4af37; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        .form-group input:focus {
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }
        .form-group input::placeholder { color: rgba(255, 255, 255, 0.3); }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e94560, #c62a47);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.5);
        }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .login-footer {
            text-align: center;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .login-footer a {
            color: rgba(212, 175, 55, 0.7);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .login-footer a:hover { color: #f0d060; }
        
        .message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            font-size: 13px;
            align-items: center;
            gap: 10px;
        }
        .message.show { display: flex; }
        .message.error {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff4757;
        }
        .message.success {
            background: rgba(40, 167, 69, 0.15);
            border: 1px solid rgba(40, 167, 69, 0.3);
            color: #34ce57;
        }
        
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 14px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .back-link:hover { color: #d4af37; }
        
        .invite-code-display {
            background: rgba(212, 175, 55, 0.15);
            border: 2px dashed rgba(212, 175, 55, 0.5);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .invite-code-display .code {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #f0d060;
        }
        
        @media (max-width: 480px) {
            .login-container { padding: 25px 20px; }
            .login-logo .logo-icon { width: 60px; height: 60px; font-size: 24px; }
            .login-logo h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <a href="landing.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>

    <div class="particles" id="particles"></div>

    <div class="login-container" id="loginContainer">
        <!-- Content will be injected by JavaScript -->
    </div>

    <script>
        // ============ FIREBASE INITIALIZATION ============
        var firebaseConfig = {
            apiKey: "AIzaSyACefHWvbETo2siNZy4ETCWZVTwIrtaNMs",
            authDomain: "srms-fd318.firebaseapp.com",
            databaseURL: "https://srms-fd318-default-rtdb.firebaseio.com",
            projectId: "srms-fd318",
            storageBucket: "srms-fd318.firebasestorage.app",
            messagingSenderId: "828888967437",
            appId: "1:828888967437:web:90461f6b1bc79854ea6844",
        };

        var database;

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
            console.log('✅ Firebase initialized successfully');
        } catch (error) {
            console.error('❌ Firebase init error:', error);
        }

        // ============ HELPER FUNCTIONS ============
        function generateInviteCode() {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            var code = "";
            for (var i = 0; i < 8; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function hashPassword(password) {
            var hash = 0;
            for (var i = 0; i < password.length; i++) {
                var char = password.charCodeAt(i);
                hash = (hash << 5) - hash + char;
                hash = hash & hash;
            }
            return hash.toString();
        }

        function showMessage(text, type) {
            var existingMsg = document.getElementById('activeMessage');
            if (existingMsg) existingMsg.remove();
            
            var msg = document.createElement('div');
            msg.id = 'activeMessage';
            msg.className = 'message show ' + type;
            msg.innerHTML = '<i class="fas fa-' + (type === 'error' ? 'exclamation-circle' : 'check-circle') + '"></i><span>' + text + '</span>';
            
            var container = document.getElementById('loginContainer');
            container.insertBefore(msg, container.firstChild.nextSibling);
            
            setTimeout(function() {
                if (msg.parentNode) msg.remove();
            }, 5000);
        }

        function showNotification(message, type) {
            var colors = {
                success: '#28a745',
                error: '#dc3545',
                warning: '#ffc107',
                info: '#17a2b8'
            };
            var icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            
            var existing = document.querySelectorAll('.notification-toast');
            existing.forEach(function(el) { el.remove(); });
            
            var notification = document.createElement('div');
            notification.className = 'notification-toast';
            notification.style.cssText = 'position:fixed;top:20px;right:20px;padding:15px 20px;background:' + (colors[type] || colors.info) + ';color:#fff;border-radius:12px;z-index:9999;max-width:350px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,0.5);display:flex;align-items:center;gap:10px;transform:translateX(120%);transition:transform 0.3s ease;';
            notification.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i><span>' + message + '</span>';
            document.body.appendChild(notification);
            
            setTimeout(function() { notification.style.transform = 'translateX(0)'; }, 100);
            setTimeout(function() {
                notification.style.transform = 'translateX(120%)';
                setTimeout(function() { if (notification.parentNode) notification.remove(); }, 300);
            }, 3000);
        }

        // ============ FORM RENDERERS ============
        function renderLoginForm() {
            var container = document.getElementById('loginContainer');
            container.innerHTML = `
                <div class="login-logo">
                    <div class="logo-icon"><i class="fas fa-school"></i></div>
                    <h1>SRMS</h1>
                    <p>School Resource Management System</p>
                </div>
                
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label><i class="fas fa-school"></i> School Name</label>
                        <input type="text" id="loginSchool" placeholder="Enter school name" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="loginEmail" placeholder="Enter email" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn-login" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>
                
                <div class="login-footer">
                    <a onclick="renderCreateSchoolForm()"><i class="fas fa-plus-circle"></i> Create School</a>
                    <a onclick="renderSignupForm()"><i class="fas fa-user-plus"></i> Sign Up with Invite Code</a>
                </div>
            `;
        }

        function renderCreateSchoolForm() {
            var container = document.getElementById('loginContainer');
            container.innerHTML = `
                <div class="login-logo">
                    <div class="logo-icon"><i class="fas fa-plus-circle"></i></div>
                    <h1>Create School</h1>
                    <p>Register your school</p>
                </div>
                
                <form onsubmit="handleCreateSchool(event)">
                    <div class="form-group">
                        <label><i class="fas fa-school"></i> School Name</label>
                        <input type="text" id="createSchoolName" placeholder="Enter school name" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Admin Name</label>
                        <input type="text" id="createAdminName" placeholder="Enter admin name" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Admin Email</label>
                        <input type="email" id="createAdminEmail" placeholder="Enter admin email" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password (min 8 chars)</label>
                        <input type="password" id="createPassword" placeholder="Enter password" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Confirm Password</label>
                        <input type="password" id="createConfirmPassword" placeholder="Confirm password" required>
                    </div>
                    <button type="submit" class="btn-login" id="createSchoolBtn">
                        <i class="fas fa-plus-circle"></i> Create School
                    </button>
                </form>
                
                <div class="login-footer">
                    <a onclick="renderLoginForm()"><i class="fas fa-arrow-left"></i> Back to Login</a>
                </div>
            `;
        }

        function renderSignupForm() {
            var container = document.getElementById('loginContainer');
            container.innerHTML = `
                <div class="login-logo">
                    <div class="logo-icon"><i class="fas fa-user-plus"></i></div>
                    <h1>Sign Up</h1>
                    <p>Create your staff account</p>
                </div>
                
                <form onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label><i class="fas fa-school"></i> School Name</label>
                        <input type="text" id="signupSchoolName" placeholder="Enter school name" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="signupName" placeholder="Enter full name" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="signupEmail" placeholder="Enter email" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-key"></i> Invite Code</label>
                        <input type="text" id="signupInviteCode" placeholder="Enter invite code" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password (min 6 chars)</label>
                        <input type="password" id="signupPassword" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn-login">
                        <i class="fas fa-user-plus"></i> Sign Up
                    </button>
                </form>
                
                <div class="login-footer">
                    <a onclick="renderLoginForm()"><i class="fas fa-arrow-left"></i> Back to Login</a>
                </div>
            `;
        }

        // ============ HANDLERS ============
        function handleLogin(event) {
            event.preventDefault();
            console.log('🔄 Login attempt...');
            
            var schoolName = document.getElementById('loginSchool').value.trim();
            var email = document.getElementById('loginEmail').value.trim();
            var password = document.getElementById('loginPassword').value;
            
            if (!schoolName || !email || !password) {
                showMessage('Please fill in all fields', 'error');
                return false;
            }
            
            var loginBtn = document.getElementById('loginBtn');
            if (loginBtn) {
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
                loginBtn.disabled = true;
            }
            
            var emailKey = email.replace(/\./g, ',');
            
            database.ref('schools/' + schoolName + '/users/' + emailKey).once('value')
                .then(function(snapshot) {
                    var user = snapshot.val();
                    console.log('📝 User found:', user);
                    
                    if (user && user.password === hashPassword(password) && user.isActive !== false) {
                        console.log('✅ Login successful!');
                        
                        var sessionUser = {
                            name: user.name,
                            email: user.email,
                            role: user.role,
                            staffId: user.staffId
                        };
                        
                        localStorage.setItem('srms_user', JSON.stringify(sessionUser));
                        localStorage.setItem('srms_school', schoolName);
                        
                        showNotification('Login successful!', 'success');
                        setTimeout(function() {
                            window.location.href = 'dashboard.html';
                        }, 500);
                    } else {
                        showMessage('Invalid credentials', 'error');
                        if (loginBtn) {
                            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                            loginBtn.disabled = false;
                        }
                    }
                })
                .catch(function(error) {
                    console.error('❌ Login error:', error);
                    showMessage('Error: ' + error.message, 'error');
                    if (loginBtn) {
                        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                        loginBtn.disabled = false;
                    }
                });
            
            return false;
        }

        function handleCreateSchool(event) {
            event.preventDefault();
            console.log('🔄 Creating school...');
            
            var schoolName = document.getElementById('createSchoolName').value.trim();
            var adminName = document.getElementById('createAdminName').value.trim();
            var adminEmail = document.getElementById('createAdminEmail').value.trim();
            var password = document.getElementById('createPassword').value;
            var confirmPassword = document.getElementById('createConfirmPassword').value;
            
            if (!schoolName || !adminName || !adminEmail || !password) {
                showMessage('Please fill in all fields', 'error');
                return false;
            }
            
            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return false;
            }
            
            if (password.length < 8) {
                showMessage('Password must be at least 8 characters', 'error');
                return false;
            }
            
            var createBtn = document.getElementById('createSchoolBtn');
            if (createBtn) {
                createBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
                createBtn.disabled = true;
            }
            
            var inviteCode = generateInviteCode();
            var emailKey = adminEmail.replace(/\./g, ',');
            
            console.log('📝 Creating school:', schoolName);
            console.log('📝 Invite code:', inviteCode);
            
            // Create all data in one batch update
            var updates = {};
            updates['schools/' + schoolName] = {
                name: schoolName,
                address: '',
                adminName: adminName,
                adminEmail: adminEmail,
                adminPhone: '',
                inviteCode: inviteCode,
                motto: '',
                createdAt: new Date().toISOString(),
                isActive: true
            };
            updates['schools/' + schoolName + '/settings'] = {
                maxBorrowDays: 14,
                maxBooksPerStudent: 3,
                finePerDay: 10
            };
            updates['schools/' + schoolName + '/users/' + emailKey] = {
                name: adminName,
                email: adminEmail,
                role: 'admin',
                staffId: 'ADMIN-001',
                password: hashPassword(password),
                createdAt: new Date().toISOString(),
                isActive: true
            };
            
            database.ref().update(updates)
                .then(function() {
                    console.log('✅ School created successfully!');
                    
                    if (createBtn) {
                        createBtn.innerHTML = '<i class="fas fa-plus-circle"></i> Create School';
                        createBtn.disabled = false;
                    }
                    
                    // Show invite code in a beautiful dialog
                    var inviteHtml = `
                        <div style="text-align:center;">
                            <i class="fas fa-check-circle" style="font-size:60px;color:#34ce57;margin-bottom:15px;"></i>
                            <h3 style="color:#f0d060;margin-bottom:10px;">School Created Successfully!</h3>
                            <p style="color:rgba(255,255,255,0.7);margin-bottom:15px;">Share this invite code with your staff:</p>
                            <div style="background:rgba(212,175,55,0.15);border:2px dashed #d4af37;border-radius:12px;padding:20px;margin-bottom:15px;">
                                <div style="font-family:'Courier New',monospace;font-size:28px;font-weight:800;letter-spacing:5px;color:#f0d060;">${inviteCode}</div>
                            </div>
                            <button onclick="closeInviteDialog()" style="padding:12px 30px;background:linear-gradient(135deg,#e94560,#c62a47);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;">
                                <i class="fas fa-check"></i> Got it!
                            </button>
                        </div>
                    `;
                    
                    showInviteDialog(inviteHtml);
                    
                    // Reset to login form with pre-filled values
                    renderLoginForm();
                    document.getElementById('loginSchool').value = schoolName;
                    document.getElementById('loginEmail').value = adminEmail;
                })
                .catch(function(error) {
                    console.error('❌ Create school error:', error);
                    showMessage('Error: ' + error.message, 'error');
                    if (createBtn) {
                        createBtn.innerHTML = '<i class="fas fa-plus-circle"></i> Create School';
                        createBtn.disabled = false;
                    }
                });
            
            return false;
        }

        function handleSignup(event) {
            event.preventDefault();
            console.log('🔄 Signup attempt...');
            
            var schoolName = document.getElementById('signupSchoolName').value.trim();
            var name = document.getElementById('signupName').value.trim();
            var email = document.getElementById('signupEmail').value.trim();
            var password = document.getElementById('signupPassword').value;
            var inviteCode = document.getElementById('signupInviteCode').value.trim();
            
            if (!schoolName || !name || !email || !password || !inviteCode) {
                showMessage('Please fill in all fields', 'error');
                return false;
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return false;
            }
            
            // Check if school exists and invite code matches
            database.ref('schools/' + schoolName).once('value')
                .then(function(snapshot) {
                    var school = snapshot.val();
                    
                    if (!school) {
                        showMessage('School not found', 'error');
                        return;
                    }
                    
                    if (school.inviteCode !== inviteCode) {
                        showMessage('Invalid invite code', 'error');
                        return;
                    }
                    
                    var emailKey = email.replace(/\./g, ',');
                    
                    return database.ref('schools/' + schoolName + '/users/' + emailKey).once('value')
                        .then(function(userSnapshot) {
                            if (userSnapshot.exists()) {
                                showMessage('User already exists', 'error');
                                return;
                            }
                            
                            return database.ref('schools/' + schoolName + '/users/' + emailKey).set({
                                name: name,
                                email: email,
                                role: 'teacher',
                                staffId: 'STAFF-' + Math.random().toString(36).substr(2, 4).toUpperCase(),
                                password: hashPassword(password),
                                createdAt: new Date().toISOString(),
                                isActive: true
                            });
                        })
                        .then(function() {
                            console.log('✅ Signup successful!');
                            showNotification('Account created! Please login.', 'success');
                            renderLoginForm();
                            document.getElementById('loginSchool').value = schoolName;
                            document.getElementById('loginEmail').value = email;
                        });
                })
                .catch(function(error) {
                    console.error('❌ Signup error:', error);
                    showMessage('Error: ' + error.message, 'error');
                });
            
            return false;
        }

        // ============ INVITE DIALOG ============
        function showInviteDialog(html) {
            var existingDialog = document.getElementById('inviteDialogOverlay');
            if (existingDialog) existingDialog.remove();
            
            var overlay = document.createElement('div');
            overlay.id = 'inviteDialogOverlay';
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
            
            var dialog = document.createElement('div');
            dialog.style.cssText = 'background:linear-gradient(135deg,#1a1f4e,#0a0e27);border:2px solid #d4af37;border-radius:20px;padding:30px;max-width:400px;width:100%;animation:slideUp 0.3s ease;';
            dialog.innerHTML = html;
            
            overlay.appendChild(dialog);
            document.body.appendChild(overlay);
        }

        function closeInviteDialog() {
            var overlay = document.getElementById('inviteDialogOverlay');
            if (overlay) overlay.remove();
        }

        // ============ PARTICLES ============
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ DOM loaded - Index page');
            
            // Create particles
            var container = document.getElementById('particles');
            for (var i = 0; i < 30; i++) {
                var particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 4 + 1 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 10 + 10 + 's';
                container.appendChild(particle);
            }
            
            // Render login form
            renderLoginForm();
            
            // Check if already logged in
            var existingUser = localStorage.getItem('srms_user');
            var existingSchool = localStorage.getItem('srms_school');
            if (existingUser && existingSchool) {
                console.log('✅ User already logged in, redirecting...');
                window.location.href = 'dashboard.html';
            }
        });

        // Expose functions globally
        window.renderLoginForm = renderLoginForm;
        window.renderCreateSchoolForm = renderCreateSchoolForm;
        window.renderSignupForm = renderSignupForm;
        window.handleLogin = handleLogin;
        window.handleCreateSchool = handleCreateSchool;
        window.handleSignup = handleSignup;
        window.closeInviteDialog = closeInviteDialog;
    </script>

</body>
</html>
