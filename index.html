<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRMS - Login | School Resource Management System</title>
    
    <meta name="description" content="SRMS - School Resource Management System Login">
    <meta name="theme-color" content="#0a0e27">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        :root {
            --primary: #e94560;
            --primary-dark: #c62a47;
            --accent: #d4af37;
            --gold: #f0d060;
            --dark: #0a0e27;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 440px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }
        .auth-logo { text-align: center; margin-bottom: 30px; }
        .auth-logo .logo-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #d4af37, #f0d060);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 35px; color: #0a0e27;
            margin: 0 auto 15px;
            box-shadow: 0 20px 60px rgba(212,175,55,0.3);
        }
        .auth-logo h1 {
            font-size: 28px; font-weight: 900;
            font-family: 'Cinzel', serif;
            background: linear-gradient(180deg, #f0d060, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }
        .auth-logo p { color: rgba(255,255,255,0.5); font-size: 13px; margin-top: 5px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; color: rgba(255,255,255,0.75); margin-bottom: 6px; font-weight: 600; font-size: 13px; }
        .form-group label i { margin-right: 8px; color: #d4af37; }
        .form-group input {
            width: 100%; padding: 13px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: #fff; font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group input:focus { border-color: rgba(212,175,55,0.6); box-shadow: 0 0 0 3px rgba(212,175,55,0.15); }
        .form-group input::placeholder { color: rgba(255,255,255,0.3); }
        .btn {
            width: 100%; padding: 14px;
            border: none; border-radius: 12px;
            font-size: 15px; font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-top: 10px;
            transition: all 0.3s ease;
        }
        .btn-primary { background: linear-gradient(135deg, #e94560, #c62a47); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(233,69,96,0.6); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .auth-links { text-align: center; margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
        .auth-links a { color: rgba(212,175,55,0.7); text-decoration: none; font-size: 13px; cursor: pointer; }
        .auth-links a:hover { color: #f0d060; }
        .message {
            padding: 12px 15px; border-radius: 10px;
            margin-bottom: 15px; display: none;
            font-size: 13px; align-items: center; gap: 10px;
        }
        .message.show { display: flex; }
        .message.error { background: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.3); color: #ff4757; }
        .message.success { background: rgba(40,167,69,0.15); border: 1px solid rgba(40,167,69,0.3); color: #34ce57; }
        .divider { border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0; position: relative; }
        .divider::after {
            content: 'OR'; position: absolute; top: -10px; left: 50%;
            transform: translateX(-50%); background: #1a1f4e;
            padding: 0 10px; font-size: 11px; color: rgba(255,255,255,0.4);
        }
        .back-link {
            position: fixed; top: 20px; left: 20px;
            color: rgba(255,255,255,0.5); text-decoration: none;
            font-size: 14px; z-index: 10;
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 8px;
        }
        .back-link:hover { color: #d4af37; }
        @media (max-width: 480px) {
            .auth-container { padding: 25px 20px; }
            .auth-logo .logo-icon { width: 60px; height: 60px; font-size: 26px; }
            .auth-logo h1 { font-size: 24px; }
            .back-link { top: 10px; left: 10px; padding: 6px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <a href="landing.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
    
    <div class="auth-container">
        <div class="auth-logo">
            <div class="logo-icon"><i class="fas fa-school"></i></div>
            <h1>SRMS</h1>
            <p>School Resource Management System</p>
        </div>
        
        <div id="message" class="message"></div>
        
        <div id="loginFormDiv">
            <div class="form-group">
                <label><i class="fas fa-school"></i> School Name</label>
                <input type="text" id="schoolName" placeholder="Enter school name" autocomplete="off">
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
            </div>
            <button type="button" class="btn btn-primary" id="loginBtn" onclick="handleLogin()">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
            <div class="divider"></div>
            <div class="auth-links">
                <a onclick="showCreateForm()"><i class="fas fa-plus-circle"></i> Create New School</a>
                <a href="landing.html"><i class="fas fa-info-circle"></i> Learn More</a>
            </div>
        </div>
        
        <div id="createFormDiv" style="display:none;">
            <div class="form-group">
                <label><i class="fas fa-school"></i> School Name</label>
                <input type="text" id="createSchoolName" placeholder="Enter school name">
            </div>
            <div class="form-group">
                <label><i class="fas fa-user"></i> Admin Name</label>
                <input type="text" id="createAdminName" placeholder="Enter admin name">
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Admin Email</label>
                <input type="email" id="createAdminEmail" placeholder="Enter admin email">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="createPassword" placeholder="Minimum 8 characters">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Confirm Password</label>
                <input type="password" id="createConfirmPassword" placeholder="Confirm password">
            </div>
            <button type="button" class="btn btn-primary" id="createSchoolBtn" onclick="handleCreateSchool()">
                <i class="fas fa-plus-circle"></i> Create School
            </button>
            <div class="divider"></div>
            <div class="auth-links">
                <a onclick="showLoginForm()"><i class="fas fa-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    
    <script>
        function showLoginForm() {
            document.getElementById('loginFormDiv').style.display = 'block';
            document.getElementById('createFormDiv').style.display = 'none';
            document.getElementById('message').className = 'message';
        }
        function showCreateForm() {
            document.getElementById('loginFormDiv').style.display = 'none';
            document.getElementById('createFormDiv').style.display = 'block';
            document.getElementById('message').className = 'message';
        }
        function showMessage(text, type) {
            var msg = document.getElementById('message');
            msg.innerHTML = '<i class="fas fa-' + (type === 'error' ? 'exclamation-circle' : 'check-circle') + '"></i> ' + text;
            msg.className = 'message show ' + type;
            setTimeout(function() { msg.className = 'message'; }, 5000);
        }
        function handleLogin() {
            var schoolName = document.getElementById('schoolName').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            
            if (!schoolName || !email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }
            
            var loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            
            API.login(schoolName, email, password).then(function(result) {
                if (result.success) {
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(function() { window.location.href = 'dashboard.html'; }, 800);
                } else {
                    showMessage(result.error || 'Invalid credentials', 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                }
            }).catch(function(error) {
                showMessage('Login failed: ' + error.message, 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            });
        }
        function handleCreateSchool() {
            var schoolName = document.getElementById('createSchoolName').value.trim();
            var adminName = document.getElementById('createAdminName').value.trim();
            var adminEmail = document.getElementById('createAdminEmail').value.trim();
            var password = document.getElementById('createPassword').value;
            var confirmPassword = document.getElementById('createConfirmPassword').value;
            
            if (!schoolName || !adminName || !adminEmail || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }
            if (password.length < 8) {
                showMessage('Password must be at least 8 characters', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            var createBtn = document.getElementById('createSchoolBtn');
            createBtn.disabled = true;
            createBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
            
            API.createSchool({
                name: schoolName,
                adminName: adminName,
                adminEmail: adminEmail,
                password: password
            }).then(function(result) {
                if (result.success) {
                    createBtn.disabled = false;
                    createBtn.innerHTML = '<i class="fas fa-plus-circle"></i> Create School';
                    
                    alert('✅ School created successfully!\n\nSchool: ' + schoolName + '\nInvite Code: ' + result.inviteCode);
                    
                    document.getElementById('schoolName').value = schoolName;
                    document.getElementById('email').value = adminEmail;
                    showLoginForm();
                    showMessage('School created! Please login.', 'success');
                } else {
                    showMessage(result.error || 'Failed to create school', 'error');
                    createBtn.disabled = false;
                    createBtn.innerHTML = '<i class="fas fa-plus-circle"></i> Create School';
                }
            }).catch(function(error) {
                showMessage('Error: ' + error.message, 'error');
                createBtn.disabled = false;
                createBtn.innerHTML = '<i class="fas fa-plus-circle"></i> Create School';
            });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('srms_user') && localStorage.getItem('srms_school')) {
                window.location.href = 'dashboard.html';
            }
        });
        
        window.showLoginForm = showLoginForm;
        window.showCreateForm = showCreateForm;
        window.handleLogin = handleLogin;
        window.handleCreateSchool = handleCreateSchool;
    </script>
</body>
</html>
