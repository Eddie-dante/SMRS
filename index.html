<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRMS - Login | School Resource Management System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDKs - MUST be before any other scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #e94560;
            --primary-dark: #c62a47;
            --accent: #d4af37;
            --gold: #f0d060;
            --dark: #0a0e27;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
            padding: 20px;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            animation: float 15s infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-100px) rotate(180deg); }
        }
        
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-logo { text-align: center; margin-bottom: 30px; }
        .login-logo .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #d4af37, #f0d060);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            color: #0a0e27;
            margin: 0 auto 15px;
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.3);
        }
        .login-logo h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(180deg, #f0d060, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-logo p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-top: 4px;
        }
        
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
        }
        .form-group label i { margin-right: 8px; color: #d4af37; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        .form-group input:focus {
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }
        .form-group input::placeholder { color: rgba(255, 255, 255, 0.3); }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e94560, #c62a47);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.5);
        }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .login-footer {
            text-align: center;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .login-footer a {
            color: rgba(212, 175, 55, 0.7);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .login-footer a:hover { color: #f0d060; }
        
        .message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            font-size: 13px;
            align-items: center;
            gap: 10px;
        }
        .message.error {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff4757;
            display: flex;
        }
        .message.success {
            background: rgba(40, 167, 69, 0.15);
            border: 1px solid rgba(40, 167, 69, 0.3);
            color: #34ce57;
            display: flex;
        }
        
        @media (max-width: 480px) {
            .login-container { padding: 25px 20px; }
            .login-logo .logo-icon { width: 60px; height: 60px; font-size: 24px; }
            .login-logo h1 { font-size: 24px; }
            .form-group input { padding: 10px 14px; font-size: 13px; }
            .btn-login { padding: 12px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="login-container" id="loginContainer">
        <div class="login-logo">
            <div class="logo-icon"><i class="fas fa-school"></i></div>
            <h1>SRMS</h1>
            <p>School Resource Management System</p>
        </div>

        <div id="errorMessage" class="message error">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">Error</span>
        </div>
        
        <div id="successMessage" class="message success">
            <i class="fas fa-check-circle"></i>
            <span id="successText">Success!</span>
        </div>

        <!-- Login Form -->
        <div id="loginFormDiv">
            <form onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label><i class="fas fa-school"></i> School Name</label>
                    <input type="text" id="schoolName" placeholder="Enter school name" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="Enter email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            <div class="login-footer">
                <a onclick="showCreateSchoolForm()"><i class="fas fa-plus-circle"></i> Create School</a>
                <a onclick="showSignupForm()"><i class="fas fa-user-plus"></i> Sign Up</a>
            </div>
        </div>

        <!-- Create School Form -->
        <div id="createSchoolFormDiv" style="display:none;">
            <form onsubmit="return handleCreateSchool(event)">
                <div class="form-group">
                    <label><i class="fas fa-school"></i> School Name</label>
                    <input type="text" id="createSchoolName" placeholder="Enter school name" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Admin Name</label>
                    <input type="text" id="createAdminName" placeholder="Enter admin name" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Admin Email</label>
                    <input type="email" id="createAdminEmail" placeholder="Enter admin email" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password (min 8 chars)</label>
                    <input type="password" id="createPassword" placeholder="Enter password" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Confirm Password</label>
                    <input type="password" id="createConfirmPassword" placeholder="Confirm password" required>
                </div>
                <button type="submit" class="btn-login" id="createSchoolBtn">
                    <i class="fas fa-plus-circle"></i> Create School
                </button>
            </form>
            <div class="login-footer">
                <a onclick="showLoginForm()"><i class="fas fa-arrow-left"></i> Back to Login</a>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="signupFormDiv" style="display:none;">
            <form onsubmit="return handleSignup(event)">
                <div class="form-group">
                    <label><i class="fas fa-school"></i> School Name</label>
                    <input type="text" id="signupSchoolName" placeholder="Enter school name" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter full name" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="signupEmail" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-key"></i> Invite Code</label>
                    <input type="text" id="signupInviteCode" placeholder="Enter invite code" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password (min 6 chars)</label>
                    <input type="password" id="signupPassword" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
            </form>
            <div class="login-footer">
                <a onclick="showLoginForm()"><i class="fas fa-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        // ============ FIREBASE INITIALIZATION ============
        var firebaseConfig = {
            apiKey: "AIzaSyACefHWvbETo2siNZy4ETCWZVTwIrtaNMs",
            authDomain: "srms-fd318.firebaseapp.com",
            databaseURL: "https://srms-fd318-default-rtdb.firebaseio.com",
            projectId: "srms-fd318",
            storageBucket: "srms-fd318.firebasestorage.app",
            messagingSenderId: "828888967437",
            appId: "1:828888967437:web:90461f6b1bc79854ea6844",
        };

        var database;

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
            console.log('✅ Firebase initialized in index.html');
        } catch (error) {
            console.error('❌ Firebase init error:', error);
        }

        // ============ PARTICLES ============
        document.addEventListener('DOMContentLoaded', function() {
            var container = document.getElementById('particles');
            for (var i = 0; i < 30; i++) {
                var particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 4 + 1 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 10 + 10 + 's';
                container.appendChild(particle);
            }
        });

        // ============ HELPERS ============
        function generateInviteCode() {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            var code = "";
            for (var i = 0; i < 8; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function hashPassword(password) {
            var hash = 0;
            for (var i = 0; i < password.length; i++) {
                var char = password.charCodeAt(i);
                hash = (hash << 5) - hash + char;
                hash = hash & hash;
            }
            return hash.toString();
        }

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').style.display = 'flex';
            document.getElementById('successMessage').style.display = 'none';
            setTimeout(function() {
                document.getElementById('errorMessage').style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            document.getElementById('successText').textContent = message;
            document.getElementById('successMessage').style.display = 'flex';
            document.getElementById('errorMessage').style.display = 'none';
            setTimeout(function() {
                document.getElementById('successMessage').style.display = 'none';
            }, 5000);
        }

        function showLoginForm() {
            document.getElementById('loginFormDiv').style.display = 'block';
            document.getElementById('createSchoolFormDiv').style.display = 'none';
            document.getElementById('signupFormDiv').style.display = 'none';
        }

        function showCreateSchoolForm() {
            document.getElementById('loginFormDiv').style.display = 'none';
            document.getElementById('createSchoolFormDiv').style.display = 'block';
            document.getElementById('signupFormDiv').style.display = 'none';
        }

        function showSignupForm() {
            document.getElementById('loginFormDiv').style.display = 'none';
            document.getElementById('createSchoolFormDiv').style.display = 'none';
            document.getElementById('signupFormDiv').style.display = 'block';
        }

        // ============ HANDLE CREATE SCHOOL ============
        function handleCreateSchool(event) {
            event.preventDefault();
            console.log('🔄 Creating school...');
            
            var schoolName = document.getElementById('createSchoolName').value.trim();
            var adminName = document.getElementById('createAdminName').value.trim();
            var adminEmail = document.getElementById('createAdminEmail').value.trim();
            var password = document.getElementById('createPassword').value;
            var confirmPassword = document.getElementById('createConfirmPassword').value;

            if (!schoolName || !adminName || !adminEmail || !password) {
                showError('Please fill in all fields');
                return false;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return false;
            }

            if (password.length < 8) {
                showError('Password must be at least 8 characters');
                return false;
            }

            var btn = document.getElementById('createSchoolBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
            btn.disabled = true;

            var inviteCode = generateInviteCode();
            var emailKey = adminEmail.replace(/\./g, ',');

            var updates = {};
            updates['schools/' + schoolName] = {
                name: schoolName,
                adminName: adminName,
                adminEmail: adminEmail,
                inviteCode: inviteCode,
                motto: '',
                createdAt: new Date().toISOString(),
                isActive: true
            };
            updates['schools/' + schoolName + '/settings'] = {
                maxBorrowDays: 14,
                maxBooksPerStudent: 3,
                finePerDay: 10
            };
            updates['schools/' + schoolName + '/users/' + emailKey] = {
                name: adminName,
                email: adminEmail,
                role: 'admin',
                staffId: 'ADMIN-001',
                password: hashPassword(password),
                createdAt: new Date().toISOString(),
                isActive: true
            };

            database.ref().update(updates).then(function() {
                console.log('✅ School created successfully!');
                console.log('📝 School:', schoolName);
                console.log('📝 Invite Code:', inviteCode);
                
                btn.innerHTML = '<i class="fas fa-plus-circle"></i> Create School';
                btn.disabled = false;
                
                showSuccess('School created successfully!');
                
                // Show dialog with invite code
                alert('✅ School Created Successfully!\n\nSchool: ' + schoolName + '\nInvite Code: ' + inviteCode + '\n\nPlease save this invite code. You can now login.');
                
                // Reset form
                document.getElementById('createSchoolName').value = '';
                document.getElementById('createAdminName').value = '';
                document.getElementById('createAdminEmail').value = '';
                document.getElementById('createPassword').value = '';
                document.getElementById('createConfirmPassword').value = '';
                
                // Switch to login form with pre-filled values
                showLoginForm();
                document.getElementById('schoolName').value = schoolName;
                document.getElementById('email').value = adminEmail;
            }).catch(function(error) {
                console.error('❌ Create school error:', error);
                btn.innerHTML = '<i class="fas fa-plus-circle"></i> Create School';
                btn.disabled = false;
                showError('Error: ' + error.message);
            });
            
            return false;
        }

        // ============ HANDLE LOGIN ============
        function handleLogin(event) {
            event.preventDefault();
            console.log('🔄 Logging in...');
            
            var schoolName = document.getElementById('schoolName').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            if (!schoolName || !email || !password) {
                showError('Please fill in all fields');
                return false;
            }

            var btn = document.getElementById('loginBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            btn.disabled = true;

            var emailKey = email.replace(/\./g, ',');

            database.ref('schools/' + schoolName + '/users/' + emailKey).once('value').then(function(snapshot) {
                var user = snapshot.val();
                console.log('📝 User found:', user ? 'Yes' : 'No');
                
                if (user && user.password === hashPassword(password) && user.isActive !== false) {
                    console.log('✅ Login successful!');
                    
                    localStorage.setItem('srms_user', JSON.stringify({
                        name: user.name,
                        email: user.email,
                        role: user.role,
                        staffId: user.staffId
                    }));
                    localStorage.setItem('srms_school', schoolName);
                    
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(function() {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showError('Invalid credentials');
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                    btn.disabled = false;
                }
            }).catch(function(error) {
                console.error('❌ Login error:', error);
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                btn.disabled = false;
                showError('Error: ' + error.message);
            });
            
            return false;
        }

        // ============ HANDLE SIGNUP ============
        function handleSignup(event) {
            event.preventDefault();
            console.log('🔄 Signing up...');
            
            var schoolName = document.getElementById('signupSchoolName').value.trim();
            var name = document.getElementById('signupName').value.trim();
            var email = document.getElementById('signupEmail').value.trim();
            var password = document.getElementById('signupPassword').value;
            var inviteCode = document.getElementById('signupInviteCode').value.trim();

            if (!schoolName || !name || !email || !password || !inviteCode) {
                showError('Please fill in all fields');
                return false;
            }

            // First verify invite code
            database.ref('schools/' + schoolName).once('value').then(function(snapshot) {
                var school = snapshot.val();
                if (!school) {
                    showError('School not found');
                    return;
                }
                
                if (school.inviteCode !== inviteCode) {
                    showError('Invalid invite code');
                    return;
                }
                
                var emailKey = email.replace(/\./g, ',');
                var updates = {};
                updates['schools/' + schoolName + '/users/' + emailKey] = {
                    name: name,
                    email: email,
                    role: 'teacher',
                    password: hashPassword(password),
                    createdAt: new Date().toISOString(),
                    isActive: true
                };
                
                return database.ref().update(updates);
            }).then(function() {
                console.log('✅ Signup successful!');
                showSuccess('Account created! Please login.');
                setTimeout(function() {
                    showLoginForm();
                    document.getElementById('schoolName').value = schoolName;
                    document.getElementById('email').value = email;
                }, 1500);
            }).catch(function(error) {
                console.error('❌ Signup error:', error);
                showError('Error: ' + error.message);
            });
            
            return false;
        }

        // Expose functions
        window.showLoginForm = showLoginForm;
        window.showCreateSchoolForm = showCreateSchoolForm;
        window.showSignupForm = showSignupForm;
        window.handleLogin = handleLogin;
        window.handleCreateSchool = handleCreateSchool;
        window.handleSignup = handleSignup;
    </script>

</body>
</html>
