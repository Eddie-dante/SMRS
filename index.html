<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0e27, #1a1f4e, #0f3460);
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { color: #f0d060; margin-bottom: 5px; }
        .subtitle { color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; color: rgba(255,255,255,0.7); margin-bottom: 5px; font-size: 13px; }
        input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #d4af37; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e94560, #c62a47);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .link {
            color: #d4af37;
            cursor: pointer;
            font-size: 13px;
            margin-top: 15px;
            display: block;
        }
        .link:hover { text-decoration: underline; }
        .message {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 13px;
        }
        .message.show { display: block; }
        .message.error { background: rgba(220,53,69,0.2); color: #ff4757; }
        .message.success { background: rgba(40,167,69,0.2); color: #34ce57; }
        .divider { border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-school"></i> SRMS</h1>
        <p class="subtitle">School Resource Management System</p>
        
        <div id="message" class="message"></div>
        
        <!-- LOGIN FORM -->
        <div id="loginFormDiv">
            <div class="form-group">
                <label>School Name</label>
                <input type="text" id="loginSchool" placeholder="Enter school name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password">
            </div>
            <button type="button" onclick="doLogin()">Login</button>
            
            <div class="divider"></div>
            
            <span class="link" onclick="showCreateForm()">➕ Create New School</span>
        </div>
        
        <!-- CREATE SCHOOL FORM -->
        <div id="createFormDiv" style="display:none;">
            <div class="form-group">
                <label>School Name</label>
                <input type="text" id="createSchoolName" placeholder="Enter school name">
            </div>
            <div class="form-group">
                <label>Admin Name</label>
                <input type="text" id="createAdminName" placeholder="Enter admin name">
            </div>
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="createAdminEmail" placeholder="Enter admin email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="createPassword" placeholder="Enter password (min 8 chars)">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="createConfirmPassword" placeholder="Confirm password">
            </div>
            <button type="button" id="createSchoolBtn" onclick="doCreateSchool()">Create School</button>
            
            <div class="divider"></div>
            
            <span class="link" onclick="showLoginForm()">← Back to Login</span>
        </div>
    </div>

    <script>
        // Initialize Firebase
        var firebaseConfig = {
            apiKey: "AIzaSyACefHWvbETo2siNZy4ETCWZVTwIrtaNMs",
            authDomain: "srms-fd318.firebaseapp.com",
            databaseURL: "https://srms-fd318-default-rtdb.firebaseio.com",
            projectId: "srms-fd318",
            storageBucket: "srms-fd318.firebasestorage.app",
            messagingSenderId: "828888967437",
            appId: "1:828888967437:web:90461f6b1bc79854ea6844",
        };

        var database;
        
        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            console.log('✅ Firebase initialized');
        } catch(e) {
            console.error('❌ Firebase error:', e);
        }

        function generateInviteCode() {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            var code = "";
            for (var i = 0; i < 8; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function hashPassword(password) {
            var hash = 0;
            for (var i = 0; i < password.length; i++) {
                var char = password.charCodeAt(i);
                hash = (hash << 5) - hash + char;
                hash = hash & hash;
            }
            return hash.toString();
        }

        function showMsg(text, type) {
            console.log('📝 Message:', text, type);
            var msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message show ' + type;
            setTimeout(function() {
                msg.className = 'message';
            }, 5000);
        }

        function showLoginForm() {
            document.getElementById('loginFormDiv').style.display = 'block';
            document.getElementById('createFormDiv').style.display = 'none';
        }

        function showCreateForm() {
            document.getElementById('loginFormDiv').style.display = 'none';
            document.getElementById('createFormDiv').style.display = 'block';
        }

        function doLogin() {
            var school = document.getElementById('loginSchool').value.trim();
            var email = document.getElementById('loginEmail').value.trim();
            var password = document.getElementById('loginPassword').value;

            if (!school || !email || !password) {
                showMsg('Please fill all fields', 'error');
                return;
            }

            var emailKey = email.replace(/\./g, ',');

            database.ref('schools/' + school + '/users/' + emailKey).once('value')
                .then(function(snapshot) {
                    var user = snapshot.val();
                    
                    if (user && user.password === hashPassword(password)) {
                        localStorage.setItem('srms_user', JSON.stringify({
                            name: user.name,
                            email: user.email,
                            role: user.role
                        }));
                        localStorage.setItem('srms_school', school);
                        
                        showMsg('Login successful! Redirecting...', 'success');
                        setTimeout(function() {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                    } else {
                        showMsg('Invalid credentials', 'error');
                    }
                })
                .catch(function(error) {
                    console.error('❌ Login error:', error);
                    showMsg('Error: ' + error.message, 'error');
                });
        }

        function doCreateSchool() {
            console.log('🔄 Create School clicked');
            
            var schoolName = document.getElementById('createSchoolName').value.trim();
            var adminName = document.getElementById('createAdminName').value.trim();
            var adminEmail = document.getElementById('createAdminEmail').value.trim();
            var password = document.getElementById('createPassword').value;
            var confirmPassword = document.getElementById('createConfirmPassword').value;

            if (!schoolName || !adminName || !adminEmail || !password) {
                showMsg('Please fill all fields', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMsg('Passwords do not match', 'error');
                return;
            }

            if (password.length < 8) {
                showMsg('Password must be at least 8 characters', 'error');
                return;
            }

            var inviteCode = generateInviteCode();
            var emailKey = adminEmail.replace(/\./g, ',');

            // Disable button and show loading
            var btn = document.getElementById('createSchoolBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';

            console.log('📝 Creating school:', schoolName);

            // STEP 1: Create school record
            database.ref('schools/' + schoolName).set({
                name: schoolName,
                adminName: adminName,
                adminEmail: adminEmail,
                inviteCode: inviteCode,
                createdAt: new Date().toISOString()
            })
            .then(function() {
                console.log('✅ Step 1: School record created');
                
                // STEP 2: Create settings
                return database.ref('schools/' + schoolName + '/settings').set({
                    maxBorrowDays: 14,
                    maxBooksPerStudent: 3,
                    finePerDay: 10
                });
            })
            .then(function() {
                console.log('✅ Step 2: Settings created');
                
                // STEP 3: Create admin user
                return database.ref('schools/' + schoolName + '/users/' + emailKey).set({
                    name: adminName,
                    email: adminEmail,
                    role: 'admin',
                    password: hashPassword(password),
                    createdAt: new Date().toISOString()
                });
            })
            .then(function() {
                console.log('✅ Step 3: Admin user created');
                console.log('✅ School created successfully!');
                
                btn.disabled = false;
                btn.textContent = 'Create School';
                
                alert('✅ School created successfully!\n\nSchool: ' + schoolName + '\nInvite Code: ' + inviteCode + '\n\nYou can now login.');
                
                document.getElementById('loginSchool').value = schoolName;
                document.getElementById('loginEmail').value = adminEmail;
                showLoginForm();
                showMsg('School created! Please login.', 'success');
            })
            .catch(function(error) {
                console.error('❌ Create error:', error);
                btn.disabled = false;
                btn.textContent = 'Create School';
                showMsg('Error: ' + error.message, 'error');
            });
        }

        // Expose functions globally
        window.doLogin = doLogin;
        window.doCreateSchool = doCreateSchool;
        window.showLoginForm = showLoginForm;
        window.showCreateForm = showCreateForm;
    </script>
</body>
</html>
