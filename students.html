<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Student Management</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Taskbar -->
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="taskbar-logo"><i class="fas fa-school"></i><span>SRMS</span></div>
        </div>
        <div class="taskbar-center">
            <button class="taskbar-btn" onclick="location.href='dashboard.html'"><i class="fas fa-home"></i> Dashboard</button>
            <button class="taskbar-btn" onclick="location.href='library.html'"><i class="fas fa-book"></i> Library</button>
            <button class="taskbar-btn active" onclick="location.href='students.html'"><i class="fas fa-users"></i> Students</button>
            <button class="taskbar-btn" onclick="location.href='furniture.html'"><i class="fas fa-chair"></i> Furniture</button>
            <button class="taskbar-btn" onclick="location.href='chat.html'"><i class="fas fa-comments"></i> Chat</button>
            <button class="taskbar-btn" onclick="location.href='reports.html'"><i class="fas fa-file-alt"></i> Reports</button>
            <button class="taskbar-btn" onclick="location.href='settings.html'"><i class="fas fa-cog"></i> Settings</button>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" onclick="location.href='wallpaper.html'" title="Change Wallpaper"><i class="fas fa-image"></i></button>
            <button class="taskbar-icon-btn" onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="content-section">
        <div class="page-header">
            <div class="page-title">
                <h1>Student Management</h1>
                <p>Manage student database</p>
            </div>
            <button class="btn btn-primary" onclick="openModal('addStudentModal')">
                <i class="fas fa-plus"></i> Add Student
            </button>
        </div>
        
        <!-- Search -->
        <div class="search-bar glass">
            <i class="fas fa-search"></i>
            <input type="text" id="searchStudents" placeholder="Search students..." onkeyup="filterStudents()">
        </div>
        
        <!-- Filters -->
        <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
            <select id="filterForm" class="form-group" style="padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: #fff;" onchange="filterStudents()">
                <option value="">All Forms</option>
                <option value="Form 1">Form 1</option>
                <option value="Form 2">Form 2</option>
                <option value="Form 3">Form 3</option>
                <option value="Form 4">Form 4</option>
            </select>
            
            <select id="filterStream" style="padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: #fff;" onchange="filterStudents()">
                <option value="">All Streams</option>
                <option value="East">East</option>
                <option value="West">West</option>
                <option value="North">North</option>
                <option value="South">South</option>
            </select>
        </div>
        
        <!-- Students Table -->
        <div class="table-container glass">
            <table class="data-table">
                <thead>
                    <tr><th>Name</th><th>ADM</th><th>Form</th><th>Stream</th><th>Gender</th><th>Parent Phone</th><th>Actions</th></tr>
                </thead>
                <tbody id="studentsTableBody"></tbody>
            </table>
        </div>
    </div>
    
    <!-- Add Student Modal -->
    <div class="modal" id="addStudentModal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2><i class="fas fa-user-plus"></i> Add New Student</h2>
                <button class="modal-close" onclick="closeModal('addStudentModal')"><i class="fas fa-times"></i></button>
            </div>
            <form id="addStudentForm" onsubmit="addStudent(event)">
                <h3 style="margin-bottom:15px;">Basic Information</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="studentName" required>
                    </div>
                    <div class="form-group">
                        <label>ADM Number *</label>
                        <input type="text" id="studentADM" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Form</label>
                        <select id="studentForm">
                            <option>Form 1</option><option>Form 2</option><option>Form 3</option><option>Form 4</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Stream</label>
                        <select id="studentStream">
                            <option>East</option><option>West</option><option>North</option><option>South</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Gender</label>
                        <select id="studentGender">
                            <option>Male</option><option>Female</option><option>Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" id="studentDOB">
                    </div>
                </div>
                
                <h3 style="margin:20px 0 15px;">Parent Information</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Parent Name</label>
                        <input type="text" id="studentParentName">
                    </div>
                    <div class="form-group">
                        <label>Parent Phone</label>
                        <input type="tel" id="studentParentPhone">
                    </div>
                </div>
                <div class="form-group">
                    <label>Parent Email</label>
                    <input type="email" id="studentParentEmail">
                </div>
                
                <h3 style="margin:20px 0 15px;">Additional Information</h3>
                <div class="form-group">
                    <label>Address</label>
                    <textarea id="studentAddress" rows="2"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Medical Info</label>
                        <textarea id="studentMedical" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Special Needs</label>
                        <textarea id="studentSpecialNeeds" rows="2"></textarea>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-plus"></i> Add Student
                </button>
            </form>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/wallpaper-loader.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
