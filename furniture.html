<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRMS - Furniture Allocation | School Resource Management System</title>
    <meta name="description" content="Allocate furniture to individual students or entire classes">
    <meta name="theme-color" content="#0a0e27">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <!-- CSS Files - FIXED PATHS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        :root {
            --primary: #e94560;
            --accent: #d4af37;
            --gold: #f0d060;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.2s ease;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 120px;
        }
        
        .taskbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .taskbar-logo { display: flex; align-items: center; gap: 10px; color: var(--gold); font-weight: 900; font-size: 22px; text-decoration: none; }
        .taskbar-logo i { font-size: 26px; }
        .taskbar-right { display: flex; gap: 8px; }
        .taskbar-icon-btn {
            width: 40px; height: 40px; border-radius: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: var(--transition);
        }
        .taskbar-icon-btn:hover { background: rgba(212, 175, 55, 0.2); color: #fff; }
        
        .floating-navbar-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: auto; max-width: 95vw;
        }
        .floating-navbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(15, 18, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-group { position: relative; display: inline-block; }
        .classy-btn {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 600;
            color: #f0e6d2;
            background: linear-gradient(135deg, rgba(35, 30, 25, 0.85), rgba(10, 8, 5, 0.95));
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 30px;
            padding: 10px 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
        }
        .classy-btn i { color: var(--accent); }
        .classy-btn:hover { color: #fff; transform: translateY(-2px); border-color: var(--gold); }
        .classy-btn.active {
            background: linear-gradient(135deg, rgba(80, 60, 25, 0.9), rgba(30, 20, 5, 0.95));
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .btn-badge {
            width: 28px; height: 28px; border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.25), rgba(0,0,0,0.4));
            border: 1px solid rgba(212,175,55,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 14, 39, 0.98);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 14px;
            padding: 10px;
            min-width: 200px;
            z-index: 1200;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .dropdown-menu.open { display: block !important; }
        .nav-group:hover .dropdown-menu { display: block; }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }
        .dropdown-item i { color: var(--accent); width: 20px; }
        .dropdown-item:hover { background: rgba(212, 175, 55, 0.15); color: #fff; }
        .dropdown-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 5px 0; }
        
        .main-content {
            padding: 85px 25px 25px;
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .page-header h1 {
            font-size: 2em;
            font-weight: 900;
            background: linear-gradient(180deg, #fff, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p { color: rgba(255,255,255,0.6); }
        
        .btn-primary {
            padding: 12px 20px;
            background: linear-gradient(135deg, #e94560, #c62a47);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(233,69,96,0.6); }
        .btn-secondary {
            padding: 12px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .mini-stat {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .mini-stat i { font-size: 28px; color: var(--accent); margin-bottom: 10px; }
        .mini-stat .value { font-size: 1.8em; font-weight: 900; }
        .mini-stat .label { font-size: 12px; color: rgba(255,255,255,0.5); text-transform: uppercase; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab {
            padding: 12px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: var(--transition);
        }
        .tab.active { background: linear-gradient(135deg, #e94560, #c62a47); color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .furniture-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .furniture-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            transition: var(--transition);
        }
        .furniture-card:hover { transform: translateY(-3px); border-color: rgba(212,175,55,0.4); }
        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-active { background: rgba(255,193,7,0.2); color: #ffc107; }
        .furniture-icon {
            width: 45px;
            height: 45px;
            background: rgba(255,193,7,0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #ffc107;
            margin-bottom: 10px;
        }
        .furniture-student-name { font-weight: 700; font-size: 15px; }
        .furniture-adm { font-size: 12px; color: rgba(255,255,255,0.5); }
        .furniture-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .furniture-detail-item {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
        }
        .furniture-detail-label { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; }
        .furniture-detail-value { font-size: 14px; font-weight: 600; color: var(--gold); }
        .btn-return {
            width: 100%;
            padding: 10px;
            background: rgba(40,167,69,0.2);
            border: 1px solid rgba(40,167,69,0.4);
            border-radius: 8px;
            color: #34ce57;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: var(--transition);
        }
        .btn-return:hover { background: rgba(40,167,69,0.4); }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: rgba(255,255,255,0.7); }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .form-group select option { background: #1a1f4e; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1300;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: rgba(26, 31, 78, 0.95);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .modal-header h3 { color: var(--accent); }
        .modal-close { background: none; border: none; color: #fff; cursor: pointer; font-size: 18px; }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.4);
        }
        .empty-state i { font-size: 36px; margin-bottom: 10px; opacity: 0.5; color: var(--accent); }
        
        @media (max-width: 768px) {
            .floating-navbar { padding: 8px 12px; gap: 6px; }
            .classy-btn { padding: 8px 12px; font-size: 11px; }
            .main-content { padding: 75px 15px 15px; }
            .form-row { grid-template-columns: 1fr; }
            .furniture-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="page-header">
            <div>
                <h1><i class="fas fa-chair" style="color:var(--accent);"></i> Furniture Allocation</h1>
                <p>Allocate to individual or entire class</p>
            </div>
            <div style="display:flex;gap:10px;">

    <!-- Allocate Individual Modal -->
    <div class="modal" id="allocateModal">

            <div class="modal-header">

            </div>
            <form onsubmit="return allocateFurniture(event)">
                <div class="form-group"><label>Student Name *</label><input type="text" id="furnitureStudentName" required></div>
                <div class="form-row">

                </div>
                <div class="form-row">
                    <div class="form-group"><label>Stream</label><select id="furnitureStream"><option>East</option><option>West</option><option>North</option><option>South</option></select></div>
                    <div class="form-group"><label>Allocation Date</label><input type="date" id="furnitureAllocationDate" required></div>
                </div>
                <div class="form-row">

                </div>

    <script>
        /**
         * ============================================
         * SRMS - Furniture Page Logic
         * ============================================
         */
        
        /**
         * Switch between active and all furniture tabs
         */
        function switchFurnitureTab(tab) {
            console.log('🔄 Switching furniture tab:', tab);
            
            var tabs = document.querySelectorAll('.tab');
            var contents = document.querySelectorAll('.tab-content');
            
            tabs.forEach(function(t) { t.classList.remove('active'); });
            contents.forEach(function(c) { c.classList.remove('active'); });
            
            if (tab === 'active') {
                tabs[0].classList.add('active');
                document.getElementById('activeFurnitureTab').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('allFurnitureTab').classList.add('active');
                
                // Copy content from active tab
                var activeContent = document.getElementById('activeFurnitureList');
                var allContent = document.getElementById('allFurnitureList');
                if (activeContent && allContent) {
                    allContent.innerHTML = activeContent.innerHTML;
                }
            }
            
            console.log('✅ Tab switched successfully');
        }
        
        /**
         * Logout with confirmation dialog
         */
        function logoutWithConfirm() {
            console.log('🔄 Logout requested');
            
            if (typeof DialogSystem !== 'undefined' && DialogSystem.confirm) {
                DialogSystem.confirm('Are you sure you want to logout?', { 
                    title: 'Logout', 
                    type: 'info', 
                    confirmText: 'Logout', 
                    cancelText: 'Cancel' 
                }).then(function(result) {
                    if (result === 'confirm') {
                        console.log('✅ Logout confirmed');
                        logout();
                    }
                });
            } else {
                if (confirm('Are you sure you want to logout?')) {
                    logout();
                }
            }
        }
        
        /**
         * Initialize page on DOM ready
         */
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 Furniture page loaded');
            
            // Verify authentication
            var user = checkAuth();
            if (!user) {
                console.log('❌ No authenticated user, redirecting...');
                return;
            }
            
            console.log('✅ User authenticated:', user.name);
            
            // Set default dates
            var allocDate = document.getElementById('furnitureAllocationDate');
            var bulkDate = document.getElementById('bulkFurnitureDate');
            
            if (allocDate && typeof getCurrentDate === 'function') {
                allocDate.value = getCurrentDate();
                console.log('📅 Allocation date set:', allocDate.value);
            }
            
            if (bulkDate && typeof getCurrentDate === 'function') {
                bulkDate.value = getCurrentDate();
                console.log('📅 Bulk date set:', bulkDate.value);
            }
            
            // Load furniture data
            if (typeof loadFurnitureData === 'function') {
                console.log('📊 Loading furniture data...');
                loadFurnitureData();
            } else {
                console.error('❌ loadFurnitureData function not found');
            }
        });
        
        window.switchFurnitureTab = switchFurnitureTab;
