<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Furniture Allocation</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        .content-section {
            padding: 30px;
            margin-top: 60px;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .page-title h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .page-title p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .furniture-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .furniture-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(212, 175, 55, 0.3);
        }
        
        .furniture-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            min-width: 200px;
        }
        
        .furniture-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 193, 7, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #ffc107;
        }
        
        .furniture-name {
            font-weight: 700;
            font-size: 16px;
            color: #ffffff;
        }
        
        .furniture-details {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }
        
        .furniture-items {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .furniture-item {
            text-align: center;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            min-width: 80px;
        }
        
        .furniture-item .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }
        
        .furniture-item .value {
            font-size: 16px;
            font-weight: 700;
            color: #d4af37;
        }
    </style>
</head>
<body>
    <!-- Taskbar -->
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="taskbar-logo">
                <i class="fas fa-school"></i>
                <span>SRMS</span>
            </div>
        </div>
        <div class="taskbar-center">
            <button class="taskbar-btn" onclick="location.href='dashboard.html'">
                <i class="fas fa-home"></i> Dashboard
            </button>
            <button class="taskbar-btn" onclick="location.href='library.html'">
                <i class="fas fa-book"></i> Library
            </button>
            <button class="taskbar-btn" onclick="location.href='students.html'">
                <i class="fas fa-users"></i> Students
            </button>
            <button class="taskbar-btn active" onclick="location.href='furniture.html'">
                <i class="fas fa-chair"></i> Furniture
            </button>
            <button class="taskbar-btn" onclick="location.href='reports.html'">
                <i class="fas fa-file-alt"></i> Reports
            </button>
            <button class="taskbar-btn" onclick="location.href='settings.html'">
                <i class="fas fa-cog"></i> Settings
            </button>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" onclick="toggleWallpaperPanel()" title="Change Wallpaper">
                <i class="fas fa-image"></i>
            </button>
            <button class="taskbar-icon-btn" onclick="logout()" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="content-section">
        <!-- Page Header -->
        <div class="page-header">
            <div class="page-title">
                <h1>Furniture Allocation</h1>
                <p>Manage chairs and lockers</p>
            </div>
            <button class="btn btn-primary" onclick="openAllocateModal()">
                <i class="fas fa-plus"></i> Allocate Furniture
            </button>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchFurnitureTab('active')">
                <i class="fas fa-chair"></i> Active
            </button>
            <button class="tab" onclick="switchFurnitureTab('returned')">
                <i class="fas fa-undo"></i> Returned
            </button>
            <button class="tab" onclick="switchFurnitureTab('all')">
                <i class="fas fa-list"></i> All Records
            </button>
        </div>
        
        <!-- Active Tab -->
        <div id="activeFurnitureTab" class="tab-content active">
            <div class="search-bar glass" style="margin-bottom: 20px;">
                <i class="fas fa-search"></i>
                <input type="text" id="searchActiveFurniture" placeholder="Search active allocations..." onkeyup="filterActiveFurniture()">
            </div>
            <div id="activeFurnitureList"></div>
        </div>
        
        <!-- Returned Tab -->
        <div id="returnedFurnitureTab" class="tab-content">
            <div id="returnedFurnitureList"></div>
        </div>
        
        <!-- All Tab -->
        <div id="allFurnitureTab" class="tab-content">
            <div id="allFurnitureList"></div>
        </div>
    </div>
    
    <!-- Allocate Furniture Modal -->
    <div class="modal" id="allocateFurnitureModal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2><i class="fas fa-chair"></i> Allocate Furniture</h2>
                <button class="modal-close" onclick="closeModal('allocateFurnitureModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="allocateFurnitureForm" onsubmit="allocateFurniture(event)">
                <div class="form-group">
                    <label>Student Name *</label>
                    <input type="text" id="furnitureStudentName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>ADM Number *</label>
                        <input type="text" id="furnitureADM" required>
                    </div>
                    <div class="form-group">
                        <label>Form</label>
                        <select id="furnitureForm">
                            <option value="Form 1">Form 1</option>
                            <option value="Form 2">Form 2</option>
                            <option value="Form 3">Form 3</option>
                            <option value="Form 4">Form 4</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Stream</label>
                        <select id="furnitureStream">
                            <option value="East">East</option>
                            <option value="West">West</option>
                            <option value="North">North</option>
                            <option value="South">South</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Allocation Date</label>
                        <input type="date" id="furnitureAllocationDate" required>
                    </div>
                </div>
                <h3 style="margin: 20px 0 15px;">Furniture Details</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Chair Number *</label>
                        <input type="text" id="chairNumber" placeholder="e.g., CH-001" required>
                    </div>
                    <div class="form-group">
                        <label>Locker Number</label>
                        <input type="text" id="lockerNumber" placeholder="e.g., LK-001">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-chair"></i> Allocate Furniture
                </button>
            </form>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/wallpaper.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
