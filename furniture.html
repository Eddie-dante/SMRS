<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Furniture Allocation | School Resource Management System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%); color: #ffffff; overflow-x: hidden; }
        
        .taskbar { position: fixed; top: 0; left: 0; right: 0; height: 65px; background: rgba(10,14,39,0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 2px 20px rgba(0,0,0,0.3); }
        .taskbar-left { display: flex; align-items: center; gap: 15px; }
        .taskbar-logo { display: flex; align-items: center; gap: 10px; color: #f0d060; font-weight: 900; font-size: 22px; letter-spacing: 1px; }
        .taskbar-logo i { font-size: 26px; }
        .taskbar-center { display: flex; align-items: center; gap: 3px; flex: 1; justify-content: center; overflow-x: auto; scrollbar-width: none; }
        .taskbar-center::-webkit-scrollbar { display: none; }
        .taskbar-btn { padding: 10px 14px; background: none; border: none; color: rgba(255,255,255,0.7); cursor: pointer; border-radius: 10px; transition: all 0.3s ease; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif; white-space: nowrap; }
        .taskbar-btn i { font-size: 13px; }
        .taskbar-btn:hover { background: rgba(255,255,255,0.1); color: #ffffff; transform: translateY(-2px); }
        .taskbar-btn.active { background: linear-gradient(135deg, #e94560, #c62a47); color: #ffffff; box-shadow: 0 4px 15px rgba(233,69,96,0.4); }
        .taskbar-right { display: flex; align-items: center; gap: 8px; }
        .taskbar-icon-btn { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #d4af37; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.3s ease; }
        .taskbar-icon-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        
        .main-content { padding: 85px 25px 25px; max-width: 1400px; margin: 0 auto; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .page-header h1 { font-size: 2em; font-weight: 900; background: linear-gradient(180deg, #ffffff, #d4af37); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 5px; }
        .page-header p { color: rgba(255,255,255,0.6); font-size: 14px; }
        
        .btn-primary { padding: 12px 20px; background: linear-gradient(135deg, #e94560, #c62a47); border: none; border-radius: 10px; color: #ffffff; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(233,69,96,0.6); }
        
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .mini-stat { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; text-align: center; }
        .mini-stat i { font-size: 28px; color: #d4af37; margin-bottom: 10px; }
        .mini-stat .value { font-size: 1.8em; font-weight: 900; }
        .mini-stat .label { font-size: 12px; color: rgba(255,255,255,0.5); text-transform: uppercase; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 12px 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: rgba(255,255,255,0.7); cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; transition: all 0.3s ease; }
        .tab:hover { background: rgba(255,255,255,0.1); color: #ffffff; }
        .tab.active { background: linear-gradient(135deg, #e94560, #c62a47); color: #ffffff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .furniture-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .furniture-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; position: relative; transition: all 0.3s ease; }
        .furniture-card:hover { transform: translateY(-3px); border-color: rgba(212,175,55,0.4); }
        .status-badge { position: absolute; top: 15px; right: 15px; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
        .status-active { background: rgba(255,193,7,0.2); color: #ffc107; }
        .status-returned { background: rgba(40,167,69,0.2); color: #34ce57; }
        .furniture-icon { width: 45px; height: 45px; background: rgba(255,193,7,0.15); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #ffc107; margin-bottom: 10px; }
        .furniture-student-name { font-weight: 700; font-size: 15px; }
        .furniture-adm { font-size: 12px; color: rgba(255,255,255,0.5); }
        .furniture-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .furniture-detail-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; }
        .furniture-detail-label { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; }
        .furniture-detail-value { font-size: 14px; font-weight: 600; color: #d4af37; }
        .btn-return { width: 100%; padding: 10px; background: rgba(40,167,69,0.2); border: 1px solid rgba(40,167,69,0.4); border-radius: 8px; color: #34ce57; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1100; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: rgba(26,31,78,0.95); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 30px; width: 90%; max-width: 550px; max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { color: #d4af37; }
        .modal-close { background: none; border: none; color: #ffffff; cursor: pointer; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: rgba(255,255,255,0.7); }
        .form-group input, .form-group select { width: 100%; padding: 10px 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: #ffffff; font-family: 'Inter', sans-serif; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        @media (max-width: 768px) { .taskbar-center { display: none; } .main-content { padding: 75px 15px 15px; } .form-row { grid-template-columns: 1fr; } .furniture-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="taskbar-logo"><i class="fas fa-school"></i><span>SRMS</span></div>
        </div>
        <div class="taskbar-center">
            <button class="taskbar-btn" onclick="location.href='dashboard.html'"><i class="fas fa-home"></i> Dashboard</button>
            <button class="taskbar-btn" onclick="location.href='library.html'"><i class="fas fa-book"></i> Library</button>
            <button class="taskbar-btn" onclick="location.href='students.html'"><i class="fas fa-users"></i> Students</button>
            <button class="taskbar-btn active" onclick="location.href='furniture.html'"><i class="fas fa-chair"></i> Furniture</button>
            <button class="taskbar-btn" onclick="location.href='chat.html'"><i class="fas fa-comments"></i> Chat</button>
            <button class="taskbar-btn" onclick="location.href='forum.html'"><i class="fas fa-bullhorn"></i> Forum</button>
            <button class="taskbar-btn" onclick="location.href='notepad.html'"><i class="fas fa-sticky-note"></i> Notes</button>
            <button class="taskbar-btn" onclick="location.href='events.html'"><i class="fas fa-calendar"></i> Events</button>
            <button class="taskbar-btn" onclick="location.href='fees.html'"><i class="fas fa-money-bill"></i> Fees</button>
            <button class="taskbar-btn" onclick="location.href='timetable.html'"><i class="fas fa-clock"></i> Timetable</button>
            <button class="taskbar-btn" onclick="location.href='teachers.html'"><i class="fas fa-chalkboard-teacher"></i> Teachers</button>
            <button class="taskbar-btn" onclick="location.href='classes.html'"><i class="fas fa-door-open"></i> Classes</button>
            <button class="taskbar-btn" onclick="location.href='terms.html'"><i class="fas fa-calendar-alt"></i> Terms</button>
            <button class="taskbar-btn" onclick="location.href='reports.html'"><i class="fas fa-file-alt"></i> Reports</button>
            <button class="taskbar-btn" onclick="location.href='settings.html'"><i class="fas fa-cog"></i> Settings</button>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" onclick="location.href='wallpaper.html'" title="Change Wallpaper"><i class="fas fa-image"></i></button>
            <button class="taskbar-icon-btn" onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="page-header">
            <div>
                <h1>Furniture Allocation</h1>
                <p>Manage chairs and lockers</p>
            </div>
            <button class="btn-primary" onclick="openModal('allocateModal')"><i class="fas fa-plus"></i> Allocate Furniture</button>
        </div>
        
        <div class="stats-row">
            <div class="mini-stat"><i class="fas fa-chair"></i><div class="value" id="totalFurnitureStat">0</div><div class="label">Total</div></div>
            <div class="mini-stat"><i class="fas fa-check-circle"></i><div class="value" id="activeFurnitureStat">0</div><div class="label">Active</div></div>
            <div class="mini-stat"><i class="fas fa-undo"></i><div class="value" id="returnedFurnitureStat">0</div><div class="label">Returned</div></div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchFurnitureTab('active')">Active</button>
            <button class="tab" onclick="switchFurnitureTab('returned')">Returned</button>
            <button class="tab" onclick="switchFurnitureTab('all')">All Records</button>
        </div>
        
        <div id="activeFurnitureTab" class="tab-content active">
            <div class="furniture-grid" id="activeFurnitureList"></div>
        </div>
        <div id="returnedFurnitureTab" class="tab-content">
            <div class="furniture-grid" id="returnedFurnitureList"></div>
        </div>
        <div id="allFurnitureTab" class="tab-content">
            <div class="furniture-grid" id="allFurnitureList"></div>
        </div>
    </div>
    
    <div class="modal" id="allocateModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-chair"></i> Allocate Furniture</h3>
                <button class="modal-close" onclick="closeModal('allocateModal')"><i class="fas fa-times"></i></button>
            </div>
            <form onsubmit="return allocateFurniture(event)">
                <div class="form-group"><label>Student Name *</label><input type="text" id="furnitureStudentName" required></div>
                <div class="form-row">
                    <div class="form-group"><label>ADM Number *</label><input type="text" id="furnitureADM" required></div>
                    <div class="form-group"><label>Form</label><select id="furnitureForm"><option>Form 1</option><option>Form 2</option><option>Form 3</option><option>Form 4</option></select></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Stream</label><select id="furnitureStream"><option>East</option><option>West</option><option>North</option><option>South</option></select></div>
                    <div class="form-group"><label>Allocation Date</label><input type="date" id="furnitureAllocationDate" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Chair Number *</label><input type="text" id="chairNumber" placeholder="CH-001" required></div>
                    <div class="form-group"><label>Locker Number</label><input type="text" id="lockerNumber" placeholder="LK-001"></div>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;"><i class="fas fa-chair"></i> Allocate</button>
            </form>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/wallpaper-loader.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('furnitureAllocationDate').value = getCurrentDate();
        });
    </script>
</body>
</html>
