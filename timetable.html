<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Timetable | School Resource Management System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        :root {
            --primary: #e94560;
            --accent: #d4af37;
            --gold: #f0d060;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 120px;
        }
        
        .taskbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
        }
        .taskbar-logo { display: flex; align-items: center; gap: 10px; color: var(--gold); font-weight: 900; font-size: 22px; }
        .taskbar-logo i { font-size: 26px; }
        .taskbar-right { display: flex; gap: 8px; }
        .taskbar-icon-btn {
            width: 40px; height: 40px; border-radius: 10px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: var(--accent); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: var(--transition);
        }
        
        .floating-navbar-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: auto; max-width: 95vw;
        }
        .floating-navbar {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; padding: 12px 24px;
            background: rgba(15, 18, 30, 0.65);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
        }
        .nav-group { position: relative; display: inline-block; }
        .classy-btn {
            font-family: 'Cinzel', serif;
            font-size: 14px; font-weight: 600;
            color: #f0e6d2;
            background: linear-gradient(135deg, rgba(35, 30, 25, 0.85), rgba(10, 8, 5, 0.95));
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 30px; padding: 10px 22px;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            transition: var(--transition);
        }
        .classy-btn i { color: var(--accent); }
        .classy-btn:hover { color: #fff; transform: translateY(-2px); }
        .classy-btn.active {
            background: linear-gradient(135deg, rgba(80, 60, 25, 0.9), rgba(30, 20, 5, 0.95));
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .btn-badge {
            width: 28px; height: 28px; border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.25), rgba(0,0,0,0.4));
            border: 1px solid rgba(212,175,55,0.4);
            display: flex; align-items: center; justify-content: center;
        }
        .dropdown-menu {
            display: none; position: absolute;
            bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
            background: rgba(10, 14, 39, 0.98);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 14px; padding: 10px; min-width: 200px;
            z-index: 1200;
        }
        .dropdown-menu.open { display: block !important; }
        .nav-group:hover .dropdown-menu, .dropdown-menu:hover { display: block !important; }
        .dropdown-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 15px; color: rgba(255,255,255,0.8);
            text-decoration: none; border-radius: 8px;
            font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .dropdown-item i { color: var(--accent); width: 20px; }
        .dropdown-item:hover { background: rgba(212, 175, 55, 0.15); color: #fff; }
        .dropdown-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 5px 0; }
        
        .main-content {
            padding: 85px 25px 25px;
            max-width: 1400px; margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .page-header { margin-bottom: 20px; }
        .page-header h1 {
            font-size: 1.8em; font-weight: 900;
            background: linear-gradient(180deg, #fff, #d4af37);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .page-header p { color: rgba(255,255,255,0.6); font-size: 13px; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab {
            padding: 12px 24px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px; color: rgba(255,255,255,0.7);
            cursor: pointer; font-family: 'Inter', sans-serif;
            font-size: 14px; font-weight: 600;
            transition: var(--transition);
            display: flex; align-items: center; gap: 8px;
        }
        .tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .tab.active { background: linear-gradient(135deg, #e94560, #c62a47); color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .form-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 25px; margin-bottom: 20px;
        }
        .form-container h3 { color: var(--accent); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: rgba(255,255,255,0.7); }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px; color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .btn-primary {
            padding: 12px 20px;
            background: linear-gradient(135deg, #e94560, #c62a47);
            border: none; border-radius: 10px; color: #fff;
            cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600;
        }
        
        /* Full Timetable Grid */
        .timetable-grid {
            overflow-x: auto;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }
        .timetable-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        .timetable-table th,
        .timetable-table td {
            padding: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 12px;
        }
        .timetable-table th {
            background: rgba(233, 69, 96, 0.8);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
        }
        .timetable-table .period-label {
            background: rgba(212, 175, 55, 0.2);
            font-weight: 700;
            color: var(--gold);
            white-space: nowrap;
        }
        .timetable-table .day-header {
            background: rgba(15, 52, 96, 0.8);
            font-weight: 700;
            color: #fff;
        }
        .timetable-table td.subject-cell {
            background: rgba(40, 167, 69, 0.15);
            color: #34ce57;
            font-weight: 600;
        }
        .timetable-table td.free-cell {
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
        }
        .timetable-heading {
            text-align: center;
            font-size: 1.5em;
            font-weight: 900;
            color: var(--gold);
            padding: 15px;
            background: rgba(212, 175, 55, 0.1);
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
        }
        
        .view-selector {
            display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .view-selector select {
            padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px; color: #fff;
            font-family: 'Inter', sans-serif;
            flex: 1;
            min-width: 200px;
        }
        .view-selector select option { background: #1a1f4e; }
        
        @media (max-width: 768px) {
            .floating-navbar { padding: 8px 12px; gap: 6px; }
            .classy-btn { padding: 8px 12px; font-size: 11px; }
            .main-content { padding: 75px 15px 15px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="taskbar-logo"><i class="fas fa-school"></i><span>SRMS</span></div>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" onclick="location.href='wallpaper.html'"><i class="fas fa-image"></i></button>
            <button class="taskbar-icon-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="page-header">
            <h1>Timetable</h1>
            <p>Class and Teacher schedules</p>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTTTab('entry')"><i class="fas fa-plus"></i> Add Entry</button>
            <button class="tab" onclick="switchTTTab('classView')"><i class="fas fa-door-open"></i> Class Timetable</button>
            <button class="tab" onclick="switchTTTab('teacherView')"><i class="fas fa-chalkboard-teacher"></i> Teacher Timetable</button>
        </div>
        
        <!-- Entry Form -->
        <div id="entryTab" class="tab-content active">
            <div class="form-container">
                <h3><i class="fas fa-plus"></i> Add Timetable Entry</h3>
                <form onsubmit="return addTimetableEntry(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Class</label>
                            <select id="ttClass"></select>
                        </div>
                        <div class="form-group">
                            <label>Day</label>
                            <select id="ttDay">
                                <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
                                <option>Thursday</option><option>Friday</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Period</label>
                            <select id="ttPeriod">
                                <option value="8:00-8:40">8:00-8:40</option>
                                <option value="8:40-9:20">8:40-9:20</option>
                                <option value="9:20-10:00">9:20-10:00</option>
                                <option value="10:20-11:00">10:20-11:00</option>
                                <option value="11:00-11:40">11:00-11:40</option>
                                <option value="11:40-12:20">11:40-12:20</option>
                                <option value="14:00-14:40">14:00-14:40</option>
                                <option value="14:40-15:20">14:40-15:20</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Subject</label><input type="text" id="ttSubject" required></div>
                        <div class="form-group"><label>Teacher</label><select id="ttTeacher"></select></div>
                        <div class="form-group"><label>Room</label><input type="text" id="ttRoom"></div>
                    </div>
                    <button type="submit" class="btn-primary"><i class="fas fa-plus"></i> Add Entry</button>
                </form>
            </div>
        </div>
        
        <!-- Class Timetable View -->
        <div id="classViewTab" class="tab-content">
            <div class="view-selector">
                <select id="classTimetableSelect" onchange="renderClassTimetable()">
                    <option value="">Select Class</option>
                </select>
            </div>
            <div id="classTimetableContainer"></div>
        </div>
        
        <!-- Teacher Timetable View -->
        <div id="teacherViewTab" class="tab-content">
            <div class="view-selector">
                <select id="teacherTimetableSelect" onchange="renderTeacherTimetable()">
                    <option value="">Select Teacher</option>
                </select>
            </div>
            <div id="teacherTimetableContainer"></div>
        </div>
    </div>
    
    <!-- Floating Navbar -->
    <div class="floating-navbar-container">
        <div class="floating-navbar">
            <button class="classy-btn" onclick="location.href='dashboard.html'"><span class="btn-badge"><i class="fas fa-th-large"></i></span> Dashboard</button>
            <div class="nav-group">
                <button class="classy-btn"><span class="btn-badge"><i class="fas fa-layer-group"></i></span> Resources <i class="fas fa-chevron-up"></i></button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="library.html"><i class="fas fa-book"></i> Library</a>
                    <a class="dropdown-item" href="furniture.html"><i class="fas fa-chair"></i> Furniture</a>
                    <a class="dropdown-item" href="qrcodes.html"><i class="fas fa-qrcode"></i> QR Codes</a>
                </div>
            </div>
            <div class="nav-group">
                <button class="classy-btn"><span class="btn-badge"><i class="fas fa-user-friends"></i></span> People <i class="fas fa-chevron-up"></i></button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="students.html"><i class="fas fa-user-graduate"></i> Students</a>
                    <a class="dropdown-item" href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> Teachers</a>
                    <a class="dropdown-item" href="classes.html"><i class="fas fa-door-open"></i> Classes</a>
                </div>
            </div>
            <div class="nav-group">
                <button class="classy-btn"><span class="btn-badge"><i class="fas fa-comments"></i></span> Communication <i class="fas fa-chevron-up"></i></button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="chat.html"><i class="fas fa-comment-dots"></i> Chat</a>
                    <a class="dropdown-item" href="forum.html"><i class="fas fa-bullhorn"></i> Forum</a>
                    <a class="dropdown-item" href="notepad.html"><i class="fas fa-sticky-note"></i> Notepad</a>
                </div>
            </div>
            <div class="nav-group">
                <button class="classy-btn active"><span class="btn-badge"><i class="fas fa-ellipsis-h"></i></span> More <i class="fas fa-chevron-up"></i></button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="events.html"><i class="fas fa-calendar"></i> Events</a>
                    <a class="dropdown-item" href="fees.html"><i class="fas fa-money-bill"></i> Fees</a>
                    <a class="dropdown-item" href="timetable.html"><i class="fas fa-clock"></i> Timetable</a>
                    <a class="dropdown-item" href="terms.html"><i class="fas fa-calendar-alt"></i> Terms</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
                    <a class="dropdown-item" href="auditlog.html"><i class="fas fa-history"></i> Audit</a>
                    <a class="dropdown-item" href="database.html"><i class="fas fa-database"></i> DB</a>
                    <a class="dropdown-item" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/wallpaper-loader.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        var allTimetableEntries = [];
        var allClasses = [];
        var allTeachers = [];
        var days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
        var periods = ['8:00-8:40', '8:40-9:20', '9:20-10:00', '10:20-11:00', '11:00-11:40', '11:40-12:20', '14:00-14:40', '14:40-15:20'];
        
        document.addEventListener('DOMContentLoaded', function() {
            initDropdownController();
            loadTimetableData();
        });
        
        function switchTTTab(tabName) {
            document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            
            if (tabName === 'entry') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('entryTab').classList.add('active');
            } else if (tabName === 'classView') {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('classViewTab').classList.add('active');
                loadClassSelector();
            } else {
                document.querySelectorAll('.tab')[2].classList.add('active');
                document.getElementById('teacherViewTab').classList.add('active');
                loadTeacherSelector();
            }
        }
        
        function loadTimetableData() {
            var school = getCurrentSchool();
            
            Promise.all([
                API.getTimetable(school),
                API.getClasses(school),
                API.getTeachers(school)
            ]).then(function(results) {
                allTimetableEntries = results[0];
                allClasses = results[1];
                allTeachers = results[2];
                
                // Populate entry form selects
                var classSelect = document.getElementById('ttClass');
                if (classSelect) {
                    var classHtml = '';
                    allClasses.forEach(function(c) {
                        classHtml += '<option value="' + c.name + '">' + c.name + ' ' + (c.stream || '') + '</option>';
                    });
                    classSelect.innerHTML = classHtml;
                }
                
                var teacherSelect = document.getElementById('ttTeacher');
                if (teacherSelect) {
                    var teacherHtml = '';
                    allTeachers.forEach(function(t) {
                        teacherHtml += '<option value="' + t.name + '">' + t.name + '</option>';
                    });
                    teacherSelect.innerHTML = teacherHtml;
                }
            });
        }
        
        function loadClassSelector() {
            var select = document.getElementById('classTimetableSelect');
            if (!select) return;
            
            var html = '<option value="">Select Class</option>';
            allClasses.forEach(function(c) {
                html += '<option value="' + c.name + '">' + c.name + ' ' + (c.stream || '') + '</option>';
            });
            select.innerHTML = html;
        }
        
        function loadTeacherSelector() {
            var select = document.getElementById('teacherTimetableSelect');
            if (!select) return;
            
            var html = '<option value="">Select Teacher</option>';
            allTeachers.forEach(function(t) {
                html += '<option value="' + t.name + '">' + t.name + '</option>';
            });
            select.innerHTML = html;
        }
        
        function renderClassTimetable() {
            var className = document.getElementById('classTimetableSelect').value;
            var container = document.getElementById('classTimetableContainer');
            if (!container || !className) return;
            
            // Filter entries for this class
            var classEntries = allTimetableEntries.filter(function(e) { return e.className === className; });
            
            var html = '<div class="timetable-heading">📋 ' + className + ' Timetable</div>';
            html += '<div class="timetable-grid"><table class="timetable-table">';
            html += '<thead><tr><th>Period</th>';
            
            days.forEach(function(day) {
                html += '<th class="day-header">' + day + '</th>';
            });
            
            html += '</tr></thead><tbody>';
            
            periods.forEach(function(period) {
                html += '<tr><td class="period-label">' + period + '</td>';
                
                days.forEach(function(day) {
                    var found = false;
                    classEntries.forEach(function(entry) {
                        if (entry.day === day && entry.period === period) {
                            found = true;
                            html += '<td class="subject-cell">' + entry.subject + '<br><small>' + (entry.teacher || '') + '</small><br><small>' + (entry.room || '') + '</small></td>';
                        }
                    });
                    
                    if (!found) {
                        html += '<td class="free-cell">Free</td>';
                    }
                });
                
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }
        
        function renderTeacherTimetable() {
            var teacherName = document.getElementById('teacherTimetableSelect').value;
            var container = document.getElementById('teacherTimetableContainer');
            if (!container || !teacherName) return;
            
            // Filter entries for this teacher
            var teacherEntries = allTimetableEntries.filter(function(e) { return e.teacher === teacherName; });
            
            var html = '<div class="timetable-heading">👨‍🏫 ' + teacherName + ' Timetable</div>';
            html += '<div class="timetable-grid"><table class="timetable-table">';
            html += '<thead><tr><th>Period</th>';
            
            days.forEach(function(day) {
                html += '<th class="day-header">' + day + '</th>';
            });
            
            html += '</tr></thead><tbody>';
            
            periods.forEach(function(period) {
                html += '<tr><td class="period-label">' + period + '</td>';
                
                days.forEach(function(day) {
                    var found = false;
                    teacherEntries.forEach(function(entry) {
                        if (entry.day === day && entry.period === period) {
                            found = true;
                            html += '<td class="subject-cell">' + entry.subject + '<br><small>' + entry.className + '</small><br><small>' + (entry.room || '') + '</small></td>';
                        }
                    });
                    
                    if (!found) {
                        html += '<td class="free-cell">Free</td>';
                    }
                });
                
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }
        
        function addTimetableEntry(event) {
            event.preventDefault();
            var school = getCurrentSchool();
            var user = getCurrentUser();
            
            API.addTimetableEntry(school, {
                className: document.getElementById('ttClass').value,
                day: document.getElementById('ttDay').value,
                period: document.getElementById('ttPeriod').value,
                subject: document.getElementById('ttSubject').value,
                teacher: document.getElementById('ttTeacher').value,
                room: document.getElementById('ttRoom').value,
                createdBy: user ? user.name : ''
            }).then(function() {
                showNotification('Entry added!', 'success');
                logAction('Timetable Added', document.getElementById('ttSubject').value);
                loadTimetableData();
            });
            return false;
        }
        
        window.switchTTTab = switchTTTab;
        window.renderClassTimetable = renderClassTimetable;
        window.renderTeacherTimetable = renderTeacherTimetable;
        window.addTimetableEntry = addTimetableEntry;
    </script>
</body>
</html>
