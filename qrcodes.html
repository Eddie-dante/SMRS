<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Library Management | School Resource Management System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        :root {
            --primary: #e94560;
            --accent: #d4af37;
            --gold: #f0d060;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 120px;
        }
        
        .taskbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
        }
        .taskbar-logo { display: flex; align-items: center; gap: 10px; color: var(--gold); font-weight: 900; font-size: 22px; }
        .taskbar-logo i { font-size: 26px; }
        .taskbar-right { display: flex; gap: 8px; }
        .taskbar-icon-btn {
            width: 40px; height: 40px; border-radius: 10px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: var(--accent); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: var(--transition);
        }
        
        .floating-navbar-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: auto; max-width: 95vw;
        }
        .floating-navbar {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; padding: 12px 24px;
            background: rgba(15, 18, 30, 0.65);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
        }
        .nav-group { position: relative; display: inline-block; }
        .classy-btn {
            font-family: 'Cinzel', serif;
            font-size: 14px; font-weight: 600;
            color: #f0e6d2;
            background: linear-gradient(135deg, rgba(35, 30, 25, 0.85), rgba(10, 8, 5, 0.95));
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 30px; padding: 10px 22px;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            transition: var(--transition);
        }
        .classy-btn i { color: var(--accent); }
        .classy-btn:hover { color: #fff; transform: translateY(-2px); }
        .classy-btn.active {
            background: linear-gradient(135deg, rgba(80, 60, 25, 0.9), rgba(30, 20, 5, 0.95));
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .btn-badge {
            width: 28px; height: 28px; border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.25), rgba(0,0,0,0.4));
            border: 1px solid rgba(212,175,55,0.4);
            display: flex; align-items: center; justify-content: center;
        }
        .dropdown-menu {
            display: none; position: absolute;
            bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
            background: rgba(10, 14, 39, 0.98);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 14px; padding: 10px; min-width: 200px;
            z-index: 1200;
        }
        .dropdown-menu.open { display: block !important; }
        .nav-group:hover .dropdown-menu, .dropdown-menu:hover { display: block !important; }
        .dropdown-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 15px; color: rgba(255,255,255,0.8);
            text-decoration: none; border-radius: 8px;
            font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .dropdown-item i { color: var(--accent); width: 20px; }
        .dropdown-item:hover { background: rgba(212, 175, 55, 0.15); color: #fff; }
        .dropdown-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 5px 0; }
        
        .main-content {
            padding: 85px 25px 25px;
            max-width: 1400px; margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .page-header h1 {
            font-size: 1.8em; font-weight: 900;
            background: linear-gradient(180deg, #fff, #d4af37);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .page-header p { color: rgba(255,255,255,0.6); font-size: 13px; }
        .btn-primary {
            padding: 12px 20px;
            background: linear-gradient(135deg, #e94560, #c62a47);
            border: none; border-radius: 10px; color: #fff;
            cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600;
        }
        .btn-secondary {
            padding: 12px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px; color: #fff;
            cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600;
        }
        
        .tabs { display: flex; gap: 6px; margin-bottom: 15px; flex-wrap: wrap; overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            padding: 10px 18px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px; color: rgba(255,255,255,0.7);
            cursor: pointer; font-family: 'Inter', sans-serif;
            font-size: 13px; white-space: nowrap; flex-shrink: 0;
            transition: var(--transition);
        }
        .tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .tab.active { background: linear-gradient(135deg, #e94560, #c62a47); color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .search-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 15px; margin-bottom: 15px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
        }
        .search-bar i { color: rgba(255,255,255,0.5); }
        .search-bar input {
            flex: 1; background: none; border: none;
            color: #fff; font-size: 14px; outline: none;
            font-family: 'Inter', sans-serif;
        }
        
        .table-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 20px;
            overflow-x: auto;
        }
        .data-table { width: 100%; border-collapse: collapse; color: #fff; }
        .data-table th {
            background: rgba(233, 69, 96, 0.8);
            padding: 15px; text-align: left;
            font-weight: 700; font-size: 12px; text-transform: uppercase;
            white-space: nowrap;
        }
        .data-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
        }
        .data-table tr:hover { background: rgba(255, 255, 255, 0.05); }
        .badge {
            display: inline-block; padding: 4px 12px;
            border-radius: 20px; font-size: 11px; font-weight: 600;
        }
        .badge-success { background: rgba(40,167,69,0.2); color: #34ce57; }
        .badge-warning { background: rgba(255,193,7,0.2); color: #ffc107; }
        .badge-danger { background: rgba(220,53,69,0.2); color: #ff4757; }
        
        .form-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 25px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: rgba(255,255,255,0.7); }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px; color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1300;
            justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: rgba(26, 31, 78, 0.95);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px; padding: 30px;
            width: 90%; max-width: 700px; max-height: 85vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .modal-header h3 { color: var(--accent); }
        .modal-close { background: none; border: none; color: #fff; cursor: pointer; font-size: 18px; }
        
        @media (max-width: 768px) {
            .floating-navbar { padding: 8px 12px; gap: 6px; }
            .classy-btn { padding: 8px 12px; font-size: 11px; }
            .main-content { padding: 75px 15px 15px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="taskbar-logo"><i class="fas fa-school"></i><span>SRMS</span></div>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" onclick="location.href='wallpaper.html'"><i class="fas fa-image"></i></button>
            <button class="taskbar-icon-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="page-header">
            <div>
                <h1>Library Management</h1>
                <p>Manage books, issue, and returns</p>
            </div>
            <button class="btn-primary" onclick="openModal('addBookModal')"><i class="fas fa-plus"></i> Add Book</button>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchLibTab('catalog')"><i class="fas fa-list"></i> Catalog</button>
            <button class="tab" onclick="switchLibTab('issue')"><i class="fas fa-book"></i> Issue Books</button>
            <button class="tab" onclick="switchLibTab('returns')"><i class="fas fa-undo"></i> Returns</button>
            <button class="tab" onclick="switchLibTab('borrowed')"><i class="fas fa-clock"></i> Borrowed</button>
        </div>
        
        <div id="catalogTab" class="tab-content active">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchBooks" placeholder="Search books..." onkeyup="filterBooks()">
            </div>
            <div class="table-container">
                <table class="data-table">
                    <thead><tr><th>Title</th><th>Author</th><th>Type</th><th>Subject</th><th>Quantity</th><th>Available</th><th>Actions</th></tr></thead>
                    <tbody id="booksTableBody"></tbody>
                </table>
            </div>
        </div>
        
        <div id="issueTab" class="tab-content">
            <div class="form-container">
                <h3 style="color:var(--accent);margin-bottom:20px;">Issue Book</h3>
                <div style="display:flex;gap:10px;margin-bottom:20px;">
                    <button class="btn-primary" id="individualBtn" onclick="showIndividualIssue()"><i class="fas fa-user"></i> Individual</button>
                    <button class="btn-secondary" id="bulkBtn" onclick="showBulkIssue()"><i class="fas fa-users"></i> Bulk (Class)</button>
                </div>
                <div id="individualIssueForm">
                    <form onsubmit="return issueBook(event)">
                        <div class="form-row">
                            <div class="form-group"><label>Student Name</label><input type="text" id="issueStudentName" required></div>
                            <div class="form-group"><label>ADM Number</label><input type="text" id="issueADM" required></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Book Title</label><select id="issueBookTitle" required><option value="">Select Book</option></select></div>
                            <div class="form-group"><label>Book Number</label><input type="text" id="issueBookNumber" required></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Borrow Date</label><input type="date" id="issueBorrowDate" required></div>
                            <div class="form-group"><label>Return Date</label><input type="date" id="issueReturnDate" required></div>
                        </div>
                        <button type="submit" class="btn-primary" style="width:100%;"><i class="fas fa-book"></i> Issue Book</button>
                    </form>
                </div>
                <div id="bulkIssueForm" style="display:none;">
                    <div class="form-group"><label>Book Title</label><select id="bulkBookTitle"><option value="">Select
