<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRMS - Database Manager | School Resource Management System</title>
    <meta name="description" content="View and manage database tables">
    <meta name="theme-color" content="#0a0e27">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        :root {
            --primary: #e94560;
            --accent: #d4af37;
            --gold: #f0d060;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 120px;
        }
        
        .taskbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px;
        }
        .taskbar-logo { display: flex; align-items: center; gap: 8px; color: var(--gold); font-weight: 900; font-size: 20px; text-decoration: none; }
        .taskbar-logo i { font-size: 22px; }
        .taskbar-right { display: flex; gap: 6px; }
        .taskbar-icon-btn {
            width: 35px; height: 35px; border-radius: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--accent); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; transition: var(--transition);
        }
        .taskbar-icon-btn:hover { background: rgba(212, 175, 55, 0.2); color: #fff; }
        
        .floating-navbar-container {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: auto; max-width: 95vw;
        }
        .floating-navbar {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 10px 15px;
            background: rgba(15, 18, 30, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            flex-wrap: wrap;
        }
        .nav-group { position: relative; display: inline-block; }
        .classy-btn {
            font-family: 'Cinzel', serif;
            font-size: 11px; font-weight: 600;
            color: #f0e6d2;
            background: linear-gradient(135deg, rgba(35, 30, 25, 0.85), rgba(10, 8, 5, 0.95));
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 25px;
            padding: 8px 14px;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: var(--transition);
        }
        .classy-btn i { color: var(--accent); font-size: 12px; }
        .classy-btn:hover { color: #fff; transform: translateY(-2px); border-color: var(--gold); }
        .classy-btn.active {
            background: linear-gradient(135deg, rgba(80, 60, 25, 0.9), rgba(30, 20, 5, 0.95));
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .btn-badge {
            width: 22px; height: 22px; border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.25), rgba(0,0,0,0.4));
            border: 1px solid rgba(212,175,55,0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px;
        }
        .dropdown-menu {
            display: none;
            position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
            background: rgba(10, 14, 39, 0.98);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px; padding: 8px; min-width: 180px;
            z-index: 1200; box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .dropdown-menu.open { display: block !important; }
        .nav-group:hover .dropdown-menu { display: block; }
        .dropdown-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; color: rgba(255,255,255,0.8);
            text-decoration: none; border-radius: 6px;
            font-size: 11px; cursor: pointer; white-space: nowrap;
            transition: var(--transition);
        }
        .dropdown-item i { color: var(--accent); width: 16px; font-size: 11px; }
        .dropdown-item:hover { background: rgba(212, 175, 55, 0.15); color: #fff; }
        .dropdown-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 4px 0; }
        
        .main-content {
            padding: 75px 20px 20px;
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-header { margin-bottom: 20px; }
        .page-header h1 {
            font-size: 1.5em; font-weight: 900;
            background: linear-gradient(180deg, #fff, #d4af37);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p { color: rgba(255,255,255,0.6); font-size: 12px; }
        
        .btn {
            padding: 10px 16px; border: none; border-radius: 8px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            font-family: 'Inter', sans-serif; transition: var(--transition);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: linear-gradient(135deg, #e94560, #c62a47); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        
        .selector-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
        }
        .selector-container label { display: block; margin-bottom: 8px; font-size: 12px; color: rgba(255,255,255,0.7); }
        .selector-container select {
            width: 100%; padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px; color: #fff;
            font-family: 'Inter', sans-serif; font-size: 13px;
        }
        .selector-container select option { background: #1a1f4e; }
        
        .table-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px; overflow-x: auto;
        }
        .data-table { width: 100%; border-collapse: collapse; color: #fff; }
        .data-table th {
            background: rgba(233, 69, 96, 0.8);
            padding: 10px; text-align: left;
            font-weight: 700; font-size: 10px; text-transform: uppercase; white-space: nowrap;
            position: sticky; top: 0; z-index: 10;
        }
        .data-table td {
            padding: 8px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px; white-space: nowrap;
        }
        .data-table tr:hover { background: rgba(255, 255, 255, 0.05); }
        
        .record-count {
            font-size: 11px; color: rgba(255,255,255,0.5);
            margin-bottom: 10px;
        }
        
        .empty-state {
            text-align: center; padding: 30px 15px; color: rgba(255,255,255,0.4);
        }
        .empty-state i { font-size: 28px; margin-bottom: 8px; opacity: 0.5; color: var(--accent); }
        
        @media (max-width: 768px) {
            .floating-navbar { padding: 6px 8px; gap: 4px; }
            .classy-btn { padding: 6px 8px; font-size: 9px; }
            .main-content { padding: 65px 10px 10px; }
        }
    </style>
</head>
<body>
    <div class="taskbar">
        <div class="taskbar-left">
            <a href="dashboard.html" class="taskbar-logo"><i class="fas fa-school"></i><span>SRMS</span></a>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" title="Wallpaper" onclick="location.href='wallpaper.html'"><i class="fas fa-image"></i></button>
            <button class="taskbar-icon-btn" title="Logout" onclick="logoutWithConfirm()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-database" style="color:var(--accent);"></i> Database Manager</h1>
            <p>View and manage all database tables</p>
        </div>
        
        <div class="selector-container">
            <label><i class="fas fa-table"></i> Select Table</label>
            <select id="databaseTableSelect" onchange="loadDatabaseTable()">
                <option value="">-- Select a table --</option>

                <option value="borrowed">📖 Borrowed Books</option>
                <option value="students">👨‍🎓 Students</option>
                <option value="furniture">🪑 Furniture</option>
                <option value="teachers">👨‍🏫 Teachers</option>
                <option value="classes">🏫 Classes</option>
                <option value="terms">📅 Terms</option>
                <option value="events">🎪 Events</option>
                <option value="fees">💰 Fees</option>
                <option value="qrcodes">🔳 QR Codes</option>
                <option value="assignments">📦 Assignments</option>
                <option value="auditLog">📋 Audit Log</option>
                <option value="users">👤 Users</option>
                <option value="chat">💬 Chat</option>

            <table class="data-table">

                    <tr><td><div class="empty-state"><i class="fas fa-database"></i><p>Select a table to view its data</p></div></td></tr>

    <div class="floating-navbar-container">

            </button>
            <div class="nav-group">

                    <a class="dropdown-item" href="furniture.html"><i class="fas fa-chair"></i> Furniture</a>

                <div class="dropdown-menu">
                    <a class="dropdown-item" href="events.html"><i class="fas fa-calendar"></i> Events</a>
                    <a class="dropdown-item" href="fees.html"><i class="fas fa-money-bill"></i> Fees</a>

    <script src="js/api.js"></script>

    <script src="js/app.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Auto-load first table
            setTimeout(function() {
                document.getElementById('databaseTableSelect').value = 'students';
                loadDatabaseTable();
            }, 500);
        });
        
        function loadDatabaseTable() {
            var school = getCurrentSchool();
            var select = document.getElementById('databaseTableSelect');
            if (!select || !select.value) return;
            
            var tableName = select.value;
            var tbody = document.getElementById('databaseTableBody');
            var thead = document.getElementById('databaseTableHead');
            var countEl = document.getElementById('recordCount');
            
            tbody.innerHTML = '<tr><td><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading ' + tableName + '...</p></div></td></tr>';
            
            API.getTableData(school, tableName).then(function(data) {
                if (!data || data.length === 0) {
                    thead.innerHTML = '';
                    tbody.innerHTML = '<tr><td><div class="empty-state"><i class="fas fa-inbox"></i><p>No data in ' + tableName + ' table</p></div></td></tr>';
                    countEl.textContent = '0 records found in ' + tableName;
                    return;
                }
                
                // Update record count
                countEl.textContent = data.length + ' records found in ' + tableName;
                
                // Get columns (exclude password)
                var columns = Object.keys(data[0]);
                var filteredColumns = columns.filter(function(c) { return c !== 'password'; });
                
                // Build header
                var headHtml = '<tr>';
                filteredColumns.forEach(function(col) {
                    headHtml += '<th>' + col + '</th>';
                });
                headHtml += '</tr>';
                thead.innerHTML = headHtml;
                
                // Build body
                var bodyHtml = '';
                data.forEach(function(row) {
                    bodyHtml += '<tr>';
                    filteredColumns.forEach(function(col) {
                        var value = row[col];
                        if (typeof value === 'object' && value !== null) {
                            value = JSON.stringify(value);
                        }
                        if (value === null || value === undefined || value === '') {
                            value = '-';
                        }
                        // Truncate long values
                        if (typeof value === 'string' && value.length > 100) {
                            value = value.substring(0, 100) + '...';
                        }
                        bodyHtml += '<td>' + value + '</td>';
                    });
                    bodyHtml += '</tr>';
                });
                tbody.innerHTML = bodyHtml;
                
            }).catch(function(error) {
                console.error('Database table error:', error);
                thead.innerHTML = '';
                tbody.innerHTML = '<tr><td><div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Error loading data</p></div></td></tr>';
                countEl.textContent = 'Error loading ' + tableName;
            });
        }
        
        function logoutWithConfirm() {
            if (typeof DialogSystem !== 'undefined' && DialogSystem.confirm) {
                DialogSystem.confirm('Logout?', { title: 'Logout', type: 'info', confirmText: 'Logout', cancelText: 'Cancel' }).then(function(result) {
                    if (result === 'confirm') logout();
                });
            } else {
                if (confirm('Logout?')) logout();
            }
        }
        
        function logout() {
            localStorage.removeItem('srms_user');
            localStorage.removeItem('srms_school');
            window.location.href = 'index.html';
        }
        
        window.loadDatabaseTable = loadDatabaseTable;
        window.logoutWithConfirm = logoutWithConfirm;
        window.logout = logout;
    </script>
</body>
