<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Database Manager | School Resource Management System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        :root {
            --primary: #e94560;
            --accent: #d4af37;
            --gold: #f0d060;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.2s ease;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 120px;
        }
        
        .taskbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
        }
        .taskbar-logo { display: flex; align-items: center; gap: 10px; color: var(--gold); font-weight: 900; font-size: 22px; }
        .taskbar-logo i { font-size: 26px; }
        .taskbar-right { display: flex; gap: 8px; }
        .taskbar-icon-btn {
            width: 40px; height: 40px; border-radius: 10px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: var(--accent); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: var(--transition);
        }
        
        .floating-navbar-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: auto; max-width: 95vw;
        }
        .floating-navbar {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; padding: 12px 24px;
            background: rgba(15, 18, 30, 0.65);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
        }
        .nav-group { position: relative; display: inline-block; }
        .classy-btn {
            font-family: 'Cinzel', serif;
            font-size: 14px; font-weight: 600;
            color: #f0e6d2;
            background: linear-gradient(135deg, rgba(35, 30, 25, 0.85), rgba(10, 8, 5, 0.95));
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 30px; padding: 10px 22px;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            transition: var(--transition);
        }
        .classy-btn i { color: var(--accent); }
        .classy-btn:hover { color: #fff; transform: translateY(-2px); }
        .classy-btn.active {
            background: linear-gradient(135deg, rgba(80, 60, 25, 0.9), rgba(30, 20, 5, 0.95));
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .btn-badge {
            width: 28px; height: 28px; border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.25), rgba(0,0,0,0.4));
            border: 1px solid rgba(212,175,55,0.4);
            display: flex; align-items: center; justify-content: center;
        }
        .dropdown-menu {
            display: none; position: absolute;
            bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
            background: rgba(10, 14, 39, 0.98);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 14px; padding: 10px; min-width: 200px;
            z-index: 1200;
        }
        .dropdown-menu.open { display: block !important; }
        .nav-group:hover .dropdown-menu, .dropdown-menu:hover { display: block !important; }
        .dropdown-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 15px; color: rgba(255,255,255,0.8);
            text-decoration: none; border-radius: 8px;
            font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .dropdown-item i { color: var(--accent); width: 20px; }
        .dropdown-item:hover { background: rgba(212, 175, 55, 0.15); color: #fff; }
        .dropdown-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 5px 0; }
        
        .main-content {
            padding: 85px 25px 25px;
            max-width: 1400px; margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .page-header { margin-bottom: 20px; }
        .page-header h1 {
            font-size: 2em; font-weight: 900;
            background: linear-gradient(180deg, #fff, #d4af37);
            background-clip: text;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .page-header p { color: rgba(255,255,255,0.6); }
        
        .selector-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 20px; margin-bottom: 20px;
        }
        .selector-container label { display: block; margin-bottom: 8px; font-size: 13px; color: rgba(255,255,255,0.7); }
        .selector-container select {
            width: 100%; padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px; color: #fff;
            font-family: 'Inter', sans-serif;
        }
        
        .table-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 15px;
            overflow-x: auto;
        }
        .data-table { width: 100%; border-collapse: collapse; color: #fff; }
        .data-table th {
            background: rgba(233, 69, 96, 0.8);
            padding: 12px; text-align: left;
            font-weight: 700; font-size: 11px; text-transform: uppercase;
            white-space: nowrap;
        }
        .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
        }
        
        @media (max-width: 768px) {
            .floating-navbar { padding: 8px 12px; gap: 6px; }
            .classy-btn { padding: 8px 12px; font-size: 11px; }
            .main-content { padding: 75px 15px 15px; }
        }
    </style>
</head>
<body>
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="taskbar-logo"><i class="fas fa-school"></i><span>SRMS</span></div>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" onclick="location.href='wallpaper.html'"><i class="fas fa-image"></i></button>
            <button class="taskbar-icon-btn" onclick="logoutWithConfirm()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="page-header">
            <h1>Database Manager</h1>
            <p>View and manage database tables</p>
        </div>
        
        <div class="selector-container">
            <label><i class="fas fa-table"></i> Select Table</label>
            <select id="databaseTableSelect" onchange="loadDatabaseTable()"></select>
        </div>
        
        <div class="table-container">
            <table class="data-table">
                <thead id="databaseTableHead"></thead>
                <tbody id="databaseTableBody">
                    <tr><td>Select a table to view data</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div class="floating-navbar-container">
        <div class="floating-navbar">
            <button class="classy-btn" onclick="location.href='dashboard.html'">
                <span class="btn-badge"><i class="fas fa-th-large"></i></span> Dashboard
            </button>
            <div class="nav-group">
                <button class="classy-btn">
                    <span class="btn-badge"><i class="fas fa-layer-group"></i></span> Resources <i class="fas fa-chevron-up"></i>
                </button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="library.html"><i class="fas fa-book"></i> Library</a>
                    <a class="dropdown-item" href="furniture.html"><i class="fas fa-chair"></i> Furniture</a>
                    <a class="dropdown-item" href="qrcodes.html"><i class="fas fa-qrcode"></i> QR Codes</a>
                </div>
            </div>
            <div class="nav-group">
                <button class="classy-btn">
                    <span class="btn-badge"><i class="fas fa-user-friends"></i></span> People <i class="fas fa-chevron-up"></i>
                </button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="students.html"><i class="fas fa-user-graduate"></i> Students</a>
                    <a class="dropdown-item" href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> Teachers</a>
                    <a class="dropdown-item" href="classes.html"><i class="fas fa-door-open"></i> Classes</a>
                </div>
            </div>
            <div class="nav-group">
                <button class="classy-btn">
                    <span class="btn-badge"><i class="fas fa-comments"></i></span> Communication <i class="fas fa-chevron-up"></i>
                </button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="chat.html"><i class="fas fa-comment-dots"></i> Chat</a>
                    <a class="dropdown-item" href="forum.html"><i class="fas fa-bullhorn"></i> Forum</a>
                    <a class="dropdown-item" href="notepad.html"><i class="fas fa-sticky-note"></i> Notepad</a>
                </div>
            </div>
            <div class="nav-group">
                <button class="classy-btn active">
                    <span class="btn-badge"><i class="fas fa-ellipsis-h"></i></span> More <i class="fas fa-chevron-up"></i>
                </button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="events.html"><i class="fas fa-calendar"></i> Events</a>
                    <a class="dropdown-item" href="fees.html"><i class="fas fa-money-bill"></i> Fees</a>
                    <a class="dropdown-item" href="timetable.html"><i class="fas fa-clock"></i> Timetable</a>
                    <a class="dropdown-item" href="terms.html"><i class="fas fa-calendar-alt"></i> Terms</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
                    <a class="dropdown-item" href="auditlog.html"><i class="fas fa-history"></i> Audit</a>
                    <a class="dropdown-item" href="database.html"><i class="fas fa-database"></i> DB</a>
                    <a class="dropdown-item" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/wallpaper-loader.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        function logoutWithConfirm() {
            DialogSystem.confirm('Are you sure you want to logout?', { title: 'Logout', type: 'info', confirmText: 'Logout', cancelText: 'Cancel' }).then(function(result) {
                if (result === 'confirm') logout();
            });
        }
        window.logoutWithConfirm = logoutWithConfirm;
    </script>
</body>
</html>
