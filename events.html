<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRMS - Events | School Resource Management System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/components.css">
    
    <style>
        :root {
            --primary: #e94560;
            --accent: #d4af37;
            --gold: #f0d060;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.2s ease;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 120px;
        }
        
        .taskbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .taskbar-logo { display: flex; align-items: center; gap: 10px; color: var(--gold); font-weight: 900; font-size: 22px; text-decoration: none; }
        .taskbar-logo i { font-size: 26px; }
        .taskbar-right { display: flex; gap: 8px; }
        .taskbar-icon-btn {
            width: 40px; height: 40px; border-radius: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: var(--transition);
        }
        .taskbar-icon-btn:hover { background: rgba(212, 175, 55, 0.2); color: #fff; }
        
        .floating-navbar-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: auto; max-width: 95vw;
        }
        .floating-navbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(15, 18, 30, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-group { position: relative; display: inline-block; }
        .classy-btn {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 600;
            color: #f0e6d2;
            background: linear-gradient(135deg, rgba(35, 30, 25, 0.85), rgba(10, 8, 5, 0.95));
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 30px;
            padding: 10px 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
        }
        .classy-btn i { color: var(--accent); }
        .classy-btn:hover { color: #fff; transform: translateY(-2px); border-color: var(--gold); }
        .classy-btn.active {
            background: linear-gradient(135deg, rgba(80, 60, 25, 0.9), rgba(30, 20, 5, 0.95));
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .btn-badge {
            width: 28px; height: 28px; border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.25), rgba(0,0,0,0.4));
            border: 1px solid rgba(212,175,55,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 14, 39, 0.98);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 14px;
            padding: 10px;
            min-width: 200px;
            z-index: 1200;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .dropdown-menu.open { display: block !important; }
        .nav-group:hover .dropdown-menu { display: block; }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }
        .dropdown-item i { color: var(--accent); width: 20px; }
        .dropdown-item:hover { background: rgba(212, 175, 55, 0.15); color: #fff; }
        .dropdown-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 5px 0; }
        
        .main-content {
            padding: 85px 25px 25px;
            max-width: 1000px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .page-header h1 {
            font-size: 2em;
            font-weight: 900;
            background: linear-gradient(180deg, #fff, #d4af37);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .page-header p { color: rgba(255,255,255,0.6); }
        
        .btn-primary {
            padding: 12px 20px;
            background: linear-gradient(135deg, #e94560, #c62a47);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(233,69,96,0.6); }
        
        .events-list { display: grid; gap: 15px; }
        .event-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            border-left: 4px solid #e94560;
            transition: var(--transition);
        }
        .event-card:hover { transform: translateY(-2px); }
        .event-card h4 { color: var(--accent); margin-bottom: 5px; }
        .event-card p { font-size: 13px; color: rgba(255,255,255,0.6); }
        .event-card small { color: rgba(255,255,255,0.4); }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1300;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: rgba(26, 31, 78, 0.95);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .modal-header h3 { color: var(--accent); }
        .modal-close { background: none; border: none; color: #fff; cursor: pointer; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: rgba(255,255,255,0.7); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.4);
        }
        .empty-state i { font-size: 36px; margin-bottom: 10px; opacity: 0.5; color: var(--accent); }
        
        @media (max-width: 768px) {
            .floating-navbar { padding: 8px 12px; gap: 6px; }
            .classy-btn { padding: 8px 12px; font-size: 11px; }
            .main-content { padding: 75px 15px 15px; }
            .form-row { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; align-items: stretch; }
            .page-header .btn { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="taskbar">
        <div class="taskbar-left">
            <a href="dashboard.html" class="taskbar-logo"><i class="fas fa-school"></i><span>SRMS</span></a>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" title="Wallpaper Settings" onclick="location.href='wallpaper.html'"><i class="fas fa-image"></i></button>
            <button class="taskbar-icon-btn" title="Logout" onclick="logoutWithConfirm()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="page-header">
            <div>
                <h1><i class="fas fa-calendar" style="color:var(--accent);"></i> Events</h1>
                <p>School calendar and events</p>
            </div>
            <button class="btn-primary" onclick="openModal('addEventModal')">
                <i class="fas fa-plus"></i> Add Event
            </button>
        </div>
        
        <div class="events-list" id="eventsList">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading events...</p></div>
        </div>
    </div>
    
    <!-- Add Event Modal -->
    <div class="modal" id="addEventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-calendar-plus"></i> Add Event</h3>
                <button class="modal-close" onclick="closeModal('addEventModal')"><i class="fas fa-times"></i></button>
            </div>
            <form onsubmit="return addEvent(event)">
                <div class="form-group"><label>Title *</label><input type="text" id="eventTitle" required></div>
                <div class="form-row">
                    <div class="form-group"><label>Date</label><input type="date" id="eventDate" required></div>
                    <div class="form-group"><label>Type</label><select id="eventType"><option>Academic</option><option>Sports</option><option>Cultural</option><option>Meeting</option><option>Holiday</option><option>Other</option></select></div>
                </div>
                <div class="form-group"><label>Description</label><textarea id="eventDescription" rows="3"></textarea></div>
                <button type="submit" class="btn-primary" style="width:100%;"><i class="fas fa-plus"></i> Add Event</button>
            </form>
        </div>
    </div>
    
    <!-- Floating Navbar -->
    <div class="floating-navbar-container">
        <div class="floating-navbar">
            <button class="classy-btn" onclick="location.href='dashboard.html'">
                <span class="btn-badge"><i class="fas fa-th-large"></i></span> Dashboard
            </button>
            
            <div class="nav-group">
                <button class="classy-btn">
                    <span class="btn-badge"><i class="fas fa-layer-group"></i></span> Resources <i class="fas fa-chevron-up"></i>
                </button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="library.html"><i class="fas fa-book"></i> Library</a>
                    <a class="dropdown-item" href="furniture.html"><i class="fas fa-chair"></i> Furniture</a>
                    <a class="dropdown-item" href="qrcodes.html"><i class="fas fa-qrcode"></i> QR Codes</a>
                </div>
            </div>
            
            <div class="nav-group">
                <button class="classy-btn">
                    <span class="btn-badge"><i class="fas fa-user-friends"></i></span> People <i class="fas fa-chevron-up"></i>
                </button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="students.html"><i class="fas fa-user-graduate"></i> Students</a>
                    <a class="dropdown-item" href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> Teachers</a>
                    <a class="dropdown-item" href="classes.html"><i class="fas fa-door-open"></i> Classes</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" href="studentsids.html"><i class="fas fa-id-card"></i> Student IDs</a>
                </div>
            </div>
            
            <div class="nav-group">
                <button class="classy-btn">
                    <span class="btn-badge"><i class="fas fa-comments"></i></span> Communication <i class="fas fa-chevron-up"></i>
                </button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="chat.html"><i class="fas fa-comment-dots"></i> Chat</a>
                    <a class="dropdown-item" href="forum.html"><i class="fas fa-bullhorn"></i> Forum</a>
                    <a class="dropdown-item" href="notepad.html"><i class="fas fa-sticky-note"></i> Notepad</a>
                </div>
            </div>
            
            <div class="nav-group">
                <button class="classy-btn active">
                    <span class="btn-badge"><i class="fas fa-ellipsis-h"></i></span> More <i class="fas fa-chevron-up"></i>
                </button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="events.html"><i class="fas fa-calendar"></i> Events</a>
                    <a class="dropdown-item" href="fees.html"><i class="fas fa-money-bill"></i> Fees</a>
                    <a class="dropdown-item" href="timetable.html"><i class="fas fa-clock"></i> Timetable</a>
                    <a class="dropdown-item" href="terms.html"><i class="fas fa-calendar-alt"></i> Terms</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
                    <a class="dropdown-item" href="auditlog.html"><i class="fas fa-history"></i> Audit</a>
                    <a class="dropdown-item" href="database.html"><i class="fas fa-database"></i> DB</a>
                    <a class="dropdown-item" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="assets/js/api.js"></script>
    <script src="assets/js/dialog.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/wallpaper-loader.js"></script>
    <script src="assets/js/app.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Set default date
            var dateEl = document.getElementById('eventDate');
            if (dateEl) dateEl.value = getCurrentDate();
            
            // Load events from app.js
            if (typeof loadEvents === 'function') {
                loadEvents();
            }
        });
        
        function logoutWithConfirm() {
            if (typeof DialogSystem !== 'undefined' && DialogSystem.confirm) {
                DialogSystem.confirm('Are you sure you want to logout?', { title: 'Logout', type: 'info', confirmText: 'Logout', cancelText: 'Cancel' }).then(function(result) {
                    if (result === 'confirm') logout();
                });
            } else {
                if (confirm('Are you sure you want to logout?')) logout();
            }
        }
        
        window.logoutWithConfirm = logoutWithConfirm;
    </script>
</body>
</html>
