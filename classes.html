<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        :root {
            --primary: #e94560;
            --accent: #d4af37;
            --gold: #f0d060;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 120px;
        }
        
        .taskbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px;
        }
        .taskbar-logo { display: flex; align-items: center; gap: 8px; color: var(--gold); font-weight: 900; font-size: 20px; text-decoration: none; }
        .taskbar-logo i { font-size: 22px; }
        .taskbar-right { display: flex; gap: 6px; }
        .taskbar-icon-btn {
            width: 35px; height: 35px; border-radius: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--accent); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; transition: var(--transition);
        }
        .taskbar-icon-btn:hover { background: rgba(212, 175, 55, 0.2); color: #fff; }
        
        .floating-navbar-container {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: auto; max-width: 95vw;
        }
        .floating-navbar {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 10px 15px;
            background: rgba(15, 18, 30, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            flex-wrap: wrap;
        }
        .nav-group { position: relative; display: inline-block; }
        .classy-btn {
            font-family: 'Cinzel', serif;
            font-size: 11px; font-weight: 600;
            color: #f0e6d2;
            background: linear-gradient(135deg, rgba(35, 30, 25, 0.85), rgba(10, 8, 5, 0.95));
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 25px;
            padding: 8px 14px;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: var(--transition);
        }
        .classy-btn i { color: var(--accent); font-size: 12px; }
        .classy-btn:hover { color: #fff; transform: translateY(-2px); border-color: var(--gold); }
        .classy-btn.active {
            background: linear-gradient(135deg, rgba(80, 60, 25, 0.9), rgba(30, 20, 5, 0.95));
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .btn-badge {
            width: 22px; height: 22px; border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.25), rgba(0,0,0,0.4));
            border: 1px solid rgba(212,175,55,0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px;
        }
        .dropdown-menu {
            display: none;
            position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
            background: rgba(10, 14, 39, 0.98);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px; padding: 8px; min-width: 180px;
            z-index: 1200; box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .dropdown-menu.open { display: block !important; }
        .nav-group:hover .dropdown-menu { display: block; }
        .dropdown-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; color: rgba(255,255,255,0.8);
            text-decoration: none; border-radius: 6px;
            font-size: 11px; cursor: pointer; white-space: nowrap;
            transition: var(--transition);
        }
        .dropdown-item i { color: var(--accent); width: 16px; font-size: 11px; }
        .dropdown-item:hover { background: rgba(212, 175, 55, 0.15); color: #fff; }
        .dropdown-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 4px 0; }
        
        .main-content {
            padding: 75px 20px 20px;
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .page-header h1 {
            font-size: 1.5em; font-weight: 900;
            background: linear-gradient(180deg, #fff, #d4af37);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p { color: rgba(255,255,255,0.6); font-size: 12px; }
        
        .btn {
            padding: 10px 16px; border: none; border-radius: 8px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            font-family: 'Inter', sans-serif; transition: var(--transition);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: linear-gradient(135deg, #e94560, #c62a47); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-sm { padding: 6px 10px; font-size: 10px; border-radius: 6px; }
        .btn-danger { background: rgba(220,53,69,0.2); color: #ff4757; border: 1px solid rgba(220,53,69,0.4); }
        .btn-danger:hover { background: rgba(220,53,69,0.4); }
        .btn-view { background: rgba(23,162,184,0.2); color: #17a2b8; border: 1px solid rgba(23,162,184,0.4); }
        .btn-view:hover { background: rgba(23,162,184,0.4); }
        
        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .class-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 20px;
            transition: var(--transition);
        }
        .class-card:hover { transform: translateY(-3px); border-color: rgba(212,175,55,0.4); }
        .class-card h4 { color: var(--accent); margin-bottom: 8px; font-size: 1em; }
        .class-card p { font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 5px; }
        .class-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1300;
            justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: rgba(26, 31, 78, 0.95);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px; padding: 25px;
            width: 90%; max-width: 700px; max-height: 85vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 18px; }
        .modal-header h3 { color: var(--accent); font-size: 1em; }
        .modal-close { background: none; border: none; color: #fff; cursor: pointer; font-size: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 11px; color: rgba(255,255,255,0.7); }
        .form-group input, .form-group select {
            width: 100%; padding: 9px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px; color: #fff;
            font-family: 'Inter', sans-serif; font-size: 13px;
        }
        .form-group select option { background: #1a1f4e; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .upload-area {
            border: 2px dashed rgba(212, 175, 55, 0.4);
            border-radius: 12px; padding: 25px; text-align: center;
            cursor: pointer; transition: var(--transition);
            background: rgba(255,255,255,0.02);
        }
        .upload-area:hover { border-color: var(--gold); background: rgba(212,175,55,0.1); }
        .upload-area i { font-size: 36px; color: var(--accent); margin-bottom: 10px; display: block; }
        .upload-area p { color: rgba(255,255,255,0.6); font-size: 13px; }
        .upload-area .file-name { color: #34ce57; font-weight: 600; margin-top: 8px; font-size: 12px; }
        
        .excel-preview-container {
            margin-top: 15px; overflow-x: auto; max-height: 250px; overflow-y: auto;
        }
        .excel-preview-container table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .excel-preview-container table th {
            background: rgba(233, 69, 96, 0.8);
            padding: 8px 10px; text-align: left;
            font-weight: 600; position: sticky; top: 0; z-index: 10;
            white-space: nowrap;
        }
        .excel-preview-container table td {
            padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.1);
            white-space: nowrap;
        }
        
        .empty-state {
            text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.4);
            grid-column: 1 / -1;
        }
        .empty-state i { font-size: 48px; margin-bottom: 15px; opacity: 0.5; color: var(--accent); }
        .loading-spinner {
            text-align: center; padding: 40px; color: rgba(255,255,255,0.5);
            grid-column: 1 / -1;
        }
        .loading-spinner i { font-size: 36px; color: var(--accent); margin-bottom: 10px; display: block; }
        
        @media (max-width: 768px) {
            .floating-navbar { padding: 6px 8px; gap: 4px; }
            .classy-btn { padding: 6px 8px; font-size: 9px; }
            .main-content { padding: 65px 10px 10px; }
            .classes-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

        <div class="taskbar-left">
            <a href="dashboard.html" class="taskbar-logo"><i class="fas fa-school"></i><span>SRMS</span></a>

                <button class="modal-close" onclick="closeModal('addClassModal')"><i class="fas fa-times"></i></button>
            </div>
            <form onsubmit="return addClassWithExcel(event)">
                <div class="form-row">

                    </div>
                    <div class="form-group">

                    </div>
                </div>
                <div class="form-group">
                    <label>Class Teacher</label>
                    <input type="text" id="classTeacher" placeholder="Teacher name">
                </div>
                
                <div class="form-group">
                    <label>Upload Student Details (.xls / .xlsx)</label>
                    <div class="upload-area" onclick="document.getElementById('excelFileInput').click()">

    <script src="js/api.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof loadClassesData === 'function') loadClassesData();
        });
        
        function handleExcelUpload(event) {
            var file = event.target.files[0];
            if (!file) return;
            
            var fileNameEl = document.getElementById('excelFileName');
            if (fileNameEl) fileNameEl.textContent = file.name;
            
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = new Uint8Array(e.target.result);
                    var workbook = XLSX.read(data, { type: "array" });
                    var firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    var jsonData = XLSX.utils.sheet_to_json(firstSheet);
                    
                    var countEl = document.getElementById("excelStudentCount");
                    var dataEl = document.getElementById("excelStudentsData");
                    var previewEl = document.getElementById("excelPreview");
                    
                    if (countEl) countEl.textContent = jsonData.length + " students loaded successfully!";
                    if (dataEl) { 
                        dataEl.value = JSON.stringify(jsonData); 
                        dataEl.dataset.loaded = "true"; 
                    }
                    
                    if (jsonData.length > 0 && previewEl) {
                        var columns = Object.keys(jsonData[0]);
                        var previewHtml = '<table><thead><tr>';
                        columns.forEach(function(col) { previewHtml += '<th>' + col + '</th>'; });
                        previewHtml += '</tr></thead><tbody>';
                        
                        jsonData.slice(0, 10).forEach(function(row) {
                            previewHtml += '<tr>';
                            columns.forEach(function(col) { previewHtml += '<td>' + (row[col] || '-') + '</td>'; });
                            previewHtml += '</tr>';
                        });
                        
                        if (jsonData.length > 10) {
                            previewHtml += '<tr><td colspan="' + columns.length + '" style="text-align:center;color:rgba(255,255,255,0.4);">... and ' + (jsonData.length - 10) + ' more students</td></tr>';
                        }
                        
                        previewHtml += '</tbody></table>';
                        previewEl.innerHTML = previewHtml;
                        previewEl.style.display = 'block';
                    }
                    
                    showNotification('Excel file loaded: ' + jsonData.length + ' students!', 'success');
                } catch(err) {
                    console.error('Excel error:', err);
                    showNotification('Error reading Excel file. Make sure it is .xlsx format.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }
        
        function logoutWithConfirm() {
            if (typeof DialogSystem !== 'undefined' && DialogSystem.confirm) {
                DialogSystem.confirm('Logout?', { title: 'Logout', type: 'info', confirmText: 'Logout', cancelText: 'Cancel' }).then(function(result) {
                    if (result === 'confirm') logout();
                });
            } else {
                if (confirm('Logout?')) logout();
            }
        }
        
        function logout() {
            localStorage.removeItem('srms_user');
            localStorage.removeItem('srms_school');
            window.location.href = 'index.html';
        }
        
        window.handleExcelUpload = handleExcelUpload;
        window.addClassWithExcel = addClassWithExcel;
        window.viewClassStudents = viewClassStudents;
        window.deleteClass = deleteClass;
        window.logoutWithConfirm = logoutWithConfirm;
        window.logout = logout;
    </script>
