<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Dashboard | School Resource Management System</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        .content-section {
            padding: 30px;
            margin-top: 60px;
            animation: fadeIn 0.5s ease;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .welcome-banner {
            background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(233,69,96,0.15));
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            animation: slideDown 0.6s ease;
            backdrop-filter: blur(15px);
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .welcome-banner h1 { font-size: 2.5em; margin-bottom: 10px; }
        .welcome-banner .school-name { font-size: 1.5em; color: #d4af37; font-weight: 700; margin-bottom: 10px; }
        .welcome-banner .user-greeting { color: rgba(255, 255, 255, 0.8); font-size: 1.1em; }
        
        .invite-code-banner {
            background: rgba(212, 175, 55, 0.1);
            border: 2px dashed rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .invite-code-banner .code {
            font-family: 'Courier New', monospace;
            font-size: 2.5em;
            font-weight: 800;
            letter-spacing: 8px;
            color: #f0d060;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 15px; }
        .stat-value { font-size: 2.2em; font-weight: 900; color: #fff; margin: 10px 0; }
        .stat-label { color: rgba(255,255,255,0.5); font-size: 13px; }
        
        .quick-actions {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .section-title { font-size: 1.2em; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: #d4af37; }
        
        .quick-actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .btn-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 25px 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        
        .btn-action i { font-size: 28px; color: #d4af37; }
        .btn-action:hover { background: rgba(255,255,255,0.08); transform: translateY(-3px); }
        
        .recent-activity {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
        }
        
        .activity-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .activity-time { font-size: 12px; color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <!-- Taskbar -->
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="taskbar-logo">
                <i class="fas fa-school"></i>
                <span>SRMS</span>
            </div>
        </div>
        <div class="taskbar-center">
            <button class="taskbar-btn active" onclick="location.href='dashboard.html'">
                <i class="fas fa-home"></i> Dashboard
            </button>
            <button class="taskbar-btn" onclick="location.href='library.html'">
                <i class="fas fa-book"></i> Library
            </button>
            <button class="taskbar-btn" onclick="location.href='students.html'">
                <i class="fas fa-users"></i> Students
            </button>
            <button class="taskbar-btn" onclick="location.href='furniture.html'">
                <i class="fas fa-chair"></i> Furniture
            </button>
            <button class="taskbar-btn" onclick="location.href='reports.html'">
                <i class="fas fa-file-alt"></i> Reports
            </button>
            <button class="taskbar-btn" onclick="location.href='settings.html'">
                <i class="fas fa-cog"></i> Settings
            </button>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" onclick="location.href='wallpaper.html'" title="Change Wallpaper">
                <i class="fas fa-image"></i>
            </button>
            <button class="taskbar-icon-btn" onclick="logout()" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="content-section">
        <div class="welcome-banner">
            <h1>Welcome Back!</h1>
            <div class="school-name" id="welcomeSchoolName">School Name</div>
            <p class="user-greeting">
                <i class="fas fa-user-circle"></i> 
                <span id="welcomeUserName">User</span> | 
                <span id="welcomeUserRole">Role</span>
            </p>
        </div>
        
        <div class="invite-code-banner" id="inviteCodeBanner" style="display: none;">
            <p style="color: rgba(255,255,255,0.7); margin-bottom: 10px;">
                <i class="fas fa-key"></i> School Invite Code
            </p>
            <div class="code" id="inviteCode">CODE</div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(233, 69, 96, 0.15); color: #e94560;">
                    <i class="fas fa-book"></i>
                </div>
                <div class="stat-value" id="totalBooks">0</div>
                <div class="stat-label">Total Books</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(40, 167, 69, 0.15); color: #28a745;">
                    <i class="fas fa-book-open"></i>
                </div>
                <div class="stat-value" id="availableBooks">0</div>
                <div class="stat-label">Available Books</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(23, 162, 184, 0.15); color: #17a2b8;">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-value" id="totalStudents">0</div>
                <div class="stat-label">Total Students</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(255, 193, 7, 0.15); color: #ffc107;">
                    <i class="fas fa-chair"></i>
                </div>
                <div class="stat-value" id="activeFurniture">0</div>
                <div class="stat-label">Active Furniture</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(220, 53, 69, 0.15); color: #dc3545;">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-value" id="overdueBooks">0</div>
                <div class="stat-label">Overdue Books</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(111, 66, 193, 0.15); color: #6f42c1;">
                    <i class="fas fa-exchange-alt"></i>
                </div>
                <div class="stat-value" id="activeLoans">0</div>
                <div class="stat-label">Active Loans</div>
            </div>
        </div>
        
        <div class="quick-actions">
            <div class="section-title"><i class="fas fa-bolt"></i> Quick Actions</div>
            <div class="quick-actions-grid">
                <button class="btn-action" onclick="location.href='library.html'">
                    <i class="fas fa-book"></i><span>Issue Book</span>
                </button>
                <button class="btn-action" onclick="location.href='students.html'">
                    <i class="fas fa-user-plus"></i><span>Add Student</span>
                </button>
                <button class="btn-action" onclick="location.href='furniture.html'">
                    <i class="fas fa-chair"></i><span>Allocate Furniture</span>
                </button>
                <button class="btn-action" onclick="location.href='reports.html'">
                    <i class="fas fa-chart-bar"></i><span>View Reports</span>
                </button>
            </div>
        </div>
        
        <div class="recent-activity">
            <div class="section-title"><i class="fas fa-history"></i> Recent Activity</div>
            <div id="recentActivity">
                <p style="text-align:center;color:rgba(255,255,255,0.5);padding:20px;">
                    Loading...
                </p>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/wallpaper-loader.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
