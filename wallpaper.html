<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Choose Wallpaper | School Resource Management System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            color: #ffffff;
        }
        
        .wallpaper-page {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
        }
        .page-header h1 {
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(180deg, #f0d060, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .page-header p { color: rgba(255,255,255,0.6); font-size: 16px; }
        
        .back-btn {
            position: fixed;
            top: 20px; left: 20px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            display: flex; align-items: center; gap: 8px;
            z-index: 100;
            backdrop-filter: blur(20px);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }
        
        .search-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 15px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .search-bar i { color: rgba(255,255,255,0.5); }
        .search-bar input {
            flex: 1; background: none; border: none;
            color: #fff; font-size: 16px; outline: none;
            font-family: 'Inter', sans-serif;
        }
        
        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        
        .wallpaper-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .wallpaper-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212,175,55,0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .wallpaper-card.active {
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212,175,55,0.4);
        }
        
        .wallpaper-preview {
            width: 100%;
            height: 140px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: rgba(255,255,255,0.8);
        }
        
        .wallpaper-info {
            padding: 15px;
            text-align: center;
        }
        .wallpaper-info h3 { font-size: 14px; margin-bottom: 5px; font-weight: 600; }
        
        .check-badge {
            position: absolute;
            top: 10px; right: 10px;
            width: 30px; height: 30px;
            background: #d4af37;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            color: #0a0e27;
            font-weight: 900;
            font-size: 14px;
        }
        .wallpaper-card.active .check-badge { display: flex; }
        
        @media (max-width: 768px) {
            .wallpaper-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
            .wallpaper-preview { height: 100px; }
        }
    </style>
</head>
<body>
    <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    
    <div class="wallpaper-page">
        <div class="page-header">
            <h1>Choose Wallpaper</h1>
            <p>Select a beautiful background</p>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="wallpaperSearch" placeholder="Search wallpapers..." onkeyup="searchWallpapers()">
        </div>
        
        <div class="wallpaper-grid" id="wallpaperGrid"></div>
    </div>
    
    <script src="js/wallpaper-loader.js"></script>
    
    <script>
        function loadWallpapers() {
            var grid = document.getElementById('wallpaperGrid');
            var currentWallpaper = localStorage.getItem('srms_wallpaper') || 'library';
            
            var html = '';
            for (var key in WALLPAPER_DATA) {
                var wallpaper = WALLPAPER_DATA[key];
                var isActive = key === currentWallpaper ? ' active' : '';
                
                var previewStyle = '';
                if (wallpaper.type === 'gradient') {
                    previewStyle = 'background:' + wallpaper.css + ';';
                } else {
                    var thumbUrl = wallpaper.url.replace('w=1920', 'w=400&h=250&fit=crop&q=60');
                    previewStyle = 'background-image:url("' + thumbUrl + '");background-size:cover;background-position:center;';
                }
                
                html += '<div class="wallpaper-card' + isActive + '" onclick="selectWallpaper(\'' + key + '\')">' +
                    '<div class="check-badge"><i class="fas fa-check"></i></div>' +
                    '<div class="wallpaper-preview" style="' + previewStyle + '"></div>' +
                    '<div class="wallpaper-info"><h3>' + wallpaper.name + '</h3></div>' +
                    '</div>';
            }
            grid.innerHTML = html;
        }
        
        function selectWallpaper(key) {
            localStorage.setItem('srms_wallpaper', key);
            var cards = document.querySelectorAll('.wallpaper-card');
            for (var i = 0; i < cards.length; i++) cards[i].classList.remove('active');
            event.target.closest('.wallpaper-card').classList.add('active');
            
            var wallpaper = WALLPAPER_DATA[key];
            if (wallpaper.type === 'gradient') {
                document.body.style.background = wallpaper.css;
                document.body.style.backgroundImage = 'none';
            } else {
                document.body.style.backgroundImage = 'linear-gradient(rgba(10,14,39,0.55),rgba(10,14,39,0.65)),url("' + wallpaper.url + '")';
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
            }
            
            showNotification('Wallpaper applied!', 'success');
        }
        
        function searchWallpapers() {
            var searchInput = document.getElementById('wallpaperSearch');
            var searchTerm = searchInput.value.toLowerCase();
            var cards = document.querySelectorAll('.wallpaper-card');
            for (var i = 0; i < cards.length; i++) {
                var name = cards[i].querySelector('h3').textContent.toLowerCase();
                cards[i].style.display = name.indexOf(searchTerm) > -1 ? '' : 'none';
            }
        }
        
        function showNotification(message, type) {
            var notification = document.createElement('div');
            notification.className = 'notification notification-' + type;
            notification.innerHTML = '<i class="fas fa-check-circle"></i><span>' + message + '</span>';
            document.body.appendChild(notification);
            setTimeout(function() { notification.classList.add('show'); }, 100);
            setTimeout(function() { notification.classList.remove('show'); setTimeout(function() { notification.remove(); }, 300); }, 3000);
        }
        
        document.addEventListener('DOMContentLoaded', loadWallpapers);
    </script>
</body>
</html>
