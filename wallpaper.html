<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRMS - Choose Wallpaper | School Resource Management System</title>
    <meta name="description" content="Choose your background wallpaper">
    <meta name="theme-color" content="#0a0e27">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --accent: #d4af37;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.3s ease;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            color: #ffffff;
            overflow-x: hidden;
        }
        
        .wallpaper-page {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
        }
        .page-header h1 {
            font-size: 2em;
            font-weight: 900;
            font-family: 'Cinzel', serif;
            background: linear-gradient(180deg, #f3e5ab, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .page-header p { color: rgba(255,255,255,0.5); font-size: 14px; }
        
        .back-btn {
            position: fixed;
            top: 20px; left: 20px;
            padding: 10px 18px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            backdrop-filter: blur(15px);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: var(--transition);
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); color: var(--accent); }
        
        .search-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .search-bar i { color: rgba(255,255,255,0.4); }
        .search-bar input {
            flex: 1; background: none; border: none;
            color: #fff; font-size: 15px; outline: none;
            font-family: 'Inter', sans-serif;
        }
        .search-bar input::placeholder { color: rgba(255,255,255,0.3); }
        
        .category-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .category-filters button {
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            transition: var(--transition);
        }
        .category-filters button:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .category-filters button.active {
            background: rgba(212,175,55,0.2);
            border-color: #d4af37;
            color: #d4af37;
            font-weight: 700;
        }
        
        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }
        
        .wallpaper-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .wallpaper-card:hover {
            transform: translateY(-4px);
            border-color: rgba(212,175,55,0.5);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .wallpaper-card.active {
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212,175,55,0.4);
        }
        
        .wallpaper-preview {
            width: 100%;
            height: 130px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: rgba(255,255,255,0.7);
        }
        
        .wallpaper-info {
            padding: 12px;
            text-align: center;
        }
        .wallpaper-info h3 { font-size: 13px; margin-bottom: 3px; font-weight: 600; }
        .wallpaper-info .category-tag {
            font-size: 9px;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .check-badge {
            position: absolute;
            top: 10px; right: 10px;
            width: 28px; height: 28px;
            background: #d4af37;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            color: #0a0e27;
            font-weight: 900;
            font-size: 13px;
        }
        .wallpaper-card.active .check-badge { display: flex; }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255,255,255,0.4);
            grid-column: 1 / -1;
        }
        .empty-state i { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
        
        @media (max-width: 768px) {
            .wallpaper-page { padding: 15px; }
            .wallpaper-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
            .wallpaper-preview { height: 100px; }
            .page-header h1 { font-size: 1.5em; }
            .back-btn { top: 10px; left: 10px; padding: 8px 12px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    
    <div class="wallpaper-page">
        <div class="page-header">
            <h1><i class="fas fa-image"></i> Choose Wallpaper</h1>
            <p>Select a beautiful background for your dashboard</p>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="wallpaperSearch" placeholder="Search wallpapers..." onkeyup="searchWallpapers()">
        </div>
        
        <div class="category-filters" id="categoryFilters">
            <button class="active" onclick="filterCategory('all')">All</button>
            <button onclick="filterCategory('School')">🏫 School</button>
            <button onclick="filterCategory('Nature')">🌿 Nature</button>
            <button onclick="filterCategory('City')">🏙️ City</button>
            <button onclick="filterCategory('Abstract')">🎨 Abstract</button>
            <button onclick="filterCategory('Default')">🌙 Default</button>
        </div>
        
        <div class="wallpaper-grid" id="wallpaperGrid">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading wallpapers...</p></div>
        </div>
    </div>

                credit: "Milad Fakurian"
            },
            technology: {

                category: "Abstract",
                credit: "Alex Knight"
            }
        };

        var currentCategory = 'all';
        var searchTerm = '';

        function loadWallpapers() {
            var grid = document.getElementById('wallpaperGrid');
            var currentWallpaper = localStorage.getItem('srms_wallpaper') || 'library';
            
            var html = '';
            var found = false;
            
            for (var key in WALLPAPER_DATA) {
                var wallpaper = WALLPAPER_DATA[key];
                var category = wallpaper.category || 'Default';
                
                if (currentCategory !== 'all' && category !== currentCategory) continue;
                if (searchTerm && !wallpaper.name.toLowerCase().includes(searchTerm.toLowerCase())) continue;
                
                found = true;
                var isActive = key === currentWallpaper ? ' active' : '';
                
                var previewStyle = '';
                if (wallpaper.type === 'gradient') {
                    previewStyle = 'background:' + wallpaper.css + ';';
                } else {
                    var thumbUrl = wallpaper.url.replace('w=1920', 'w=400&h=250&fit=crop&q=60');
                    previewStyle = 'background-image:url("' + thumbUrl + '");background-size:cover;background-position:center;';
                }
                
                html += '<div class="wallpaper-card' + isActive + '" onclick="selectWallpaper(\'' + key + '\')">' +
                    '<div class="check-badge"><i class="fas fa-check"></i></div>' +
                    '<div class="wallpaper-preview" style="' + previewStyle + '"></div>' +
                    '<div class="wallpaper-info">' +
                    '<h3>' + wallpaper.name + '</h3>' +
                    '<div class="category-tag">' + category + '</div>' +
                    '</div></div>';
            }
            
            if (!found) {
                grid.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>No wallpapers found</p></div>';
            } else {
                grid.innerHTML = html;
            }
        }

        function selectWallpaper(key) {
            localStorage.setItem('srms_wallpaper', key);
            
            var cards = document.querySelectorAll('.wallpaper-card');
            for (var i = 0; i < cards.length; i++) cards[i].classList.remove('active');
            
            var target = event ? event.target.closest('.wallpaper-card') : null;
            if (target) target.classList.add('active');
            
            var wallpaper = WALLPAPER_DATA[key];
            if (wallpaper.type === 'gradient') {
                document.body.style.background = wallpaper.css;
                document.body.style.backgroundImage = 'none';
            } else {
                document.body.style.backgroundImage = 'linear-gradient(rgba(10,14,39,0.55),rgba(10,14,39,0.65)),url("' + wallpaper.url + '")';
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
            }
            
            alert('✅ Wallpaper applied!');
        }

        function searchWallpapers() {
            searchTerm = document.getElementById('wallpaperSearch').value;
            loadWallpapers();
        }

        function filterCategory(category) {
            currentCategory = category;
            
            var buttons = document.querySelectorAll('.category-filters button');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            event.target.classList.add('active');
            
            loadWallpapers();
        }

        document.addEventListener('DOMContentLoaded', loadWallpapers);
        
        window.loadWallpapers = loadWallpapers;
        window.selectWallpaper = selectWallpaper;
        window.searchWallpapers = searchWallpapers;
        window.filterCategory = filterCategory;
    </script>
