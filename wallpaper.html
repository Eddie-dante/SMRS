<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Choose Wallpaper</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #e94560;
            --accent: #d4af37;
            --gold: #f0d060;
            --dark: #0a0e27;
            --dark-light: #1a1f4e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%);
            color: #ffffff;
        }
        
        .wallpaper-page {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }
        
        .page-header h1 {
            font-size: 2.5em;
            background: linear-gradient(180deg, #f0d060, #d4af37, #b8941f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .page-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #ffffff;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            z-index: 100;
            backdrop-filter: blur(20px);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            margin-bottom: 30px;
        }
        
        .search-bar i {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .search-bar input {
            flex: 1;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        
        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        
        .wallpaper-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .wallpaper-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .wallpaper-card.active {
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        
        .wallpaper-preview {
            width: 100%;
            height: 130px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .wallpaper-info {
            padding: 15px;
            text-align: center;
        }
        
        .wallpaper-info h3 {
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .wallpaper-info p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .wallpaper-card.active .wallpaper-info h3 {
            color: #d4af37;
        }
        
        .check-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: #d4af37;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            color: #0a0e27;
            font-weight: 900;
            font-size: 14px;
        }
        
        .wallpaper-card.active .check-badge {
            display: flex;
        }
        
        @media (max-width: 768px) {
            .wallpaper-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }
            
            .wallpaper-preview {
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <a href="dashboard.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
    
    <div class="wallpaper-page">
        <div class="page-header">
            <h1>Choose Wallpaper</h1>
            <p>Select a beautiful background for your SRMS experience</p>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="wallpaperSearch" placeholder="Search wallpapers..." onkeyup="searchWallpapers()">
        </div>
        
        <div class="wallpaper-grid" id="wallpaperGrid"></div>
    </div>
    
    <script src="js/wallpaper-loader.js"></script>
    
    <script>
        function loadWallpapers() {
            const grid = document.getElementById('wallpaperGrid');
            const currentWallpaper = localStorage.getItem('srms_wallpaper') || 'none';
            
            grid.innerHTML = Object.entries(WALLPAPER_DATA).map(([key, wallpaper]) => {
                const isActive = key === currentWallpaper;
                const previewStyle = wallpaper.type === 'gradient' 
                    ? `background: ${wallpaper.css};`
                    : `background-image: url('${wallpaper.url.replace('w=1920', 'w=400')}');`;
                
                return `
                    <div class="wallpaper-card ${isActive ? 'active' : ''}" onclick="selectWallpaper('${key}')">
                        <div class="check-badge"><i class="fas fa-check"></i></div>
                        <div class="wallpaper-preview" style="${previewStyle}"></div>
                        <div class="wallpaper-info">
                            <h3>${wallpaper.name}</h3>
                            <p>${wallpaper.type === 'gradient' ? 'Built-in' : 'Unsplash Photo'}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function selectWallpaper(key) {
            localStorage.setItem('srms_wallpaper', key);
            
            document.querySelectorAll('.wallpaper-card').forEach(card => {
                card.classList.remove('active');
            });
            event.target.closest('.wallpaper-card').classList.add('active');
            
            // Apply immediately
            const wallpaper = WALLPAPER_DATA[key];
            if (wallpaper.type === 'gradient') {
                document.body.style.background = wallpaper.css;
                document.body.style.backgroundImage = 'none';
            } else {
                document.body.style.backgroundImage = `linear-gradient(rgba(10, 14, 39, 0.55), rgba(10, 14, 39, 0.65)), url('${wallpaper.url}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
            }
            
            showNotification('Wallpaper applied!', 'success');
        }
        
        function searchWallpapers() {
            const searchInput = document.getElementById('wallpaperSearch');
            const searchTerm = searchInput.value.toLowerCase();
            const cards = document.querySelectorAll('.wallpaper-card');
            
            cards.forEach(card => {
                const name = card.querySelector('h3').textContent.toLowerCase();
                card.style.display = name.includes(searchTerm) ? '' : 'none';
            });
        }
        
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed; top: 20px; right: 20px;
                background: #28a745; color: white;
                padding: 15px 20px; border-radius: 12px;
                z-index: 1000; animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 2000);
        }
        
        document.addEventListener('DOMContentLoaded', loadWallpapers);
    </script>
</body>
</html>
