<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Settings | School Resource Management System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0f3460 100%); color: #ffffff; overflow-x: hidden; }
        
        .taskbar { position: fixed; top: 0; left: 0; right: 0; height: 65px; background: rgba(10,14,39,0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 2px 20px rgba(0,0,0,0.3); }
        .taskbar-left { display: flex; align-items: center; gap: 15px; }
        .taskbar-logo { display: flex; align-items: center; gap: 10px; color: #f0d060; font-weight: 900; font-size: 22px; letter-spacing: 1px; }
        .taskbar-logo i { font-size: 26px; }
        .taskbar-center { display: flex; align-items: center; gap: 3px; flex: 1; justify-content: center; overflow-x: auto; scrollbar-width: none; }
        .taskbar-center::-webkit-scrollbar { display: none; }
        .taskbar-btn { padding: 10px 14px; background: none; border: none; color: rgba(255,255,255,0.7); cursor: pointer; border-radius: 10px; transition: all 0.3s ease; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif; white-space: nowrap; }
        .taskbar-btn i { font-size: 13px; }
        .taskbar-btn:hover { background: rgba(255,255,255,0.1); color: #ffffff; transform: translateY(-2px); }
        .taskbar-btn.active { background: linear-gradient(135deg, #e94560, #c62a47); color: #ffffff; box-shadow: 0 4px 15px rgba(233,69,96,0.4); }
        .taskbar-right { display: flex; align-items: center; gap: 8px; }
        .taskbar-icon-btn { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #d4af37; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.3s ease; }
        .taskbar-icon-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        
        .main-content { padding: 85px 25px 25px; max-width: 900px; margin: 0 auto; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-header { margin-bottom: 25px; }
        .page-header h1 { font-size: 2em; font-weight: 900; background: linear-gradient(180deg, #ffffff, #d4af37); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 5px; }
        .page-header p { color: rgba(255,255,255,0.6); font-size: 14px; }
        
        .settings-section { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 25px; margin-bottom: 20px; }
        .settings-section h3 { color: #d4af37; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: rgba(255,255,255,0.7); }
        .form-group input, .form-group select { width: 100%; padding: 10px 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: #ffffff; font-family: 'Inter', sans-serif; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-primary { padding: 12px 20px; background: linear-gradient(135deg, #e94560, #c62a47); border: none; border-radius: 10px; color: #ffffff; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-danger { padding: 12px 20px; background: linear-gradient(135deg, #dc3545, #ff4757); border: none; border-radius: 10px; color: #ffffff; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; }
        
        .table-container { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; color: #ffffff; }
        .data-table th { background: rgba(233,69,96,0.8); padding: 12px; text-align: left; font-weight: 700; font-size: 11px; text-transform: uppercase; }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 13px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 600; }
        .badge-success { background: rgba(40,167,69,0.2); color: #34ce57; }
        .badge-danger { background: rgba(220,53,69,0.2); color: #ff4757; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1100; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: rgba(26,31,78,0.95); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 30px; width: 90%; max-width: 500px; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .modal-header h3 { color: #d4af37; }
        .modal-close { background: none; border: none; color: #ffffff; cursor: pointer; font-size: 18px; }
        
        @media (max-width: 768px) { .taskbar-center { display: none; } .main-content { padding: 75px 15px 15px; } .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="taskbar-logo"><i class="fas fa-school"></i><span>SRMS</span></div>
        </div>
        <div class="taskbar-center">
            <button class="taskbar-btn" onclick="location.href='dashboard.html'"><i class="fas fa-home"></i> Dashboard</button>
            <button class="taskbar-btn" onclick="location.href='library.html'"><i class="fas fa-book"></i> Library</button>
            <button class="taskbar-btn" onclick="location.href='students.html'"><i class="fas fa-users"></i> Students</button>
            <button class="taskbar-btn" onclick="location.href='furniture.html'"><i class="fas fa-chair"></i> Furniture</button>
            <button class="taskbar-btn" onclick="location.href='chat.html'"><i class="fas fa-comments"></i> Chat</button>
            <button class="taskbar-btn" onclick="location.href='forum.html'"><i class="fas fa-bullhorn"></i> Forum</button>
            <button class="taskbar-btn" onclick="location.href='notepad.html'"><i class="fas fa-sticky-note"></i> Notes</button>
            <button class="taskbar-btn" onclick="location.href='events.html'"><i class="fas fa-calendar"></i> Events</button>
            <button class="taskbar-btn" onclick="location.href='fees.html'"><i class="fas fa-money-bill"></i> Fees</button>
            <button class="taskbar-btn" onclick="location.href='timetable.html'"><i class="fas fa-clock"></i> Timetable</button>
            <button class="taskbar-btn" onclick="location.href='teachers.html'"><i class="fas fa-chalkboard-teacher"></i> Teachers</button>
            <button class="taskbar-btn" onclick="location.href='classes.html'"><i class="fas fa-door-open"></i> Classes</button>
            <button class="taskbar-btn" onclick="location.href='terms.html'"><i class="fas fa-calendar-alt"></i> Terms</button>
            <button class="taskbar-btn" onclick="location.href='reports.html'"><i class="fas fa-file-alt"></i> Reports</button>
            <button class="taskbar-btn active" onclick="location.href='settings.html'"><i class="fas fa-cog"></i> Settings</button>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" onclick="location.href='wallpaper.html'" title="Change Wallpaper"><i class="fas fa-image"></i></button>
            <button class="taskbar-icon-btn" onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="page-header">
            <h1>Settings</h1>
            <p>Manage your school settings</p>
        </div>
        
        <div class="settings-section">
            <h3><i class="fas fa-school"></i> School Information</h3>
            <form onsubmit="return saveSchoolInfo(event)">
                <div class="form-row">
                    <div class="form-group"><label>School Name</label><input type="text" id="schoolNameInput" required></div>
                    <div class="form-group"><label>Address</label><input type="text" id="schoolAddress"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Admin Name</label><input type="text" id="adminName"></div>
                    <div class="form-group"><label>Admin Email</label><input type="email" id="adminEmail"></div>
                </div>
                <div class="form-group"><label>School Motto</label><input type="text" id="schoolMotto" placeholder="Strive for Excellence"></div>
                <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save Information</button>
            </form>
        </div>
        
        <div class="settings-section">
            <h3><i class="fas fa-book"></i> Library Settings</h3>
            <form onsubmit="return saveSettings(event)">
                <div class="form-row">
                    <div class="form-group"><label>Max Borrow Days</label><input type="number" id="maxBorrowDays" min="1" max="30" value="14"></div>
                    <div class="form-group"><label>Max Books Per Student</label><input type="number" id="maxBooksPerStudent" min="1" max="10" value="3"></div>
                </div>
                <div class="form-group"><label>Fine Per Day (KES)</label><input type="number" id="finePerDay" min="0" value="10"></div>
                <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save Settings</button>
            </form>
        </div>
        
        <div class="settings-section">
            <h3><i class="fas fa-users"></i> User Management</h3>
            <div class="table-container">
                <table class="data-table">
                    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
            <button class="btn-primary" style="margin-top:15px;" onclick="openModal('addUserModal')"><i class="fas fa-user-plus"></i> Add User</button>
        </div>
        
        <div class="settings-section">
            <h3><i class="fas fa-database"></i> Data Management</h3>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <button class="btn-primary" onclick="exportData()"><i class="fas fa-download"></i> Export Data</button>
                <button class="btn-danger" onclick="clearAllData()"><i class="fas fa-trash"></i> Clear All Data</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="addUserModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-user-plus"></i> Add User</h3>
                <button class="modal-close" onclick="closeModal('addUserModal')"><i class="fas fa-times"></i></button>
            </div>
            <form onsubmit="return addUser(event)">
                <div class="form-group"><label>Full Name</label><input type="text" id="newUserName" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="newUserEmail" required></div>
                <div class="form-row">
                    <div class="form-group"><label>Role</label><select id="newUserRole"><option value="teacher">Teacher</option><option value="librarian">Librarian</option><option value="admin">Admin</option></select></div>
                    <div class="form-group"><label>Password</label><input type="password" id="newUserPassword" required></div>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;"><i class="fas fa-plus"></i> Add User</button>
            </form>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/wallpaper-loader.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        function exportData() { showNotification('Data exported!', 'success'); }
        function clearAllData() { if (confirm('Are you sure? This cannot be undone!')) { showNotification('Data cleared!', 'warning'); } }
    </script>
</body>
</html>
