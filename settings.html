<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Settings</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Taskbar -->
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="taskbar-logo"><i class="fas fa-school"></i><span>SRMS</span></div>
        </div>
        <div class="taskbar-center">
            <button class="taskbar-btn" onclick="location.href='dashboard.html'"><i class="fas fa-home"></i> Dashboard</button>
            <button class="taskbar-btn" onclick="location.href='library.html'"><i class="fas fa-book"></i> Library</button>
            <button class="taskbar-btn" onclick="location.href='students.html'"><i class="fas fa-users"></i> Students</button>
            <button class="taskbar-btn" onclick="location.href='furniture.html'"><i class="fas fa-chair"></i> Furniture</button>
            <button class="taskbar-btn" onclick="location.href='reports.html'"><i class="fas fa-file-alt"></i> Reports</button>
            <button class="taskbar-btn active" onclick="location.href='settings.html'"><i class="fas fa-cog"></i> Settings</button>
        </div>
        <div class="taskbar-right">
            <button class="taskbar-icon-btn" onclick="location.href='wallpaper.html'" title="Change Wallpaper"><i class="fas fa-image"></i></button>
            <button class="taskbar-icon-btn" onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="content-section">
        <div class="page-header">
            <div class="page-title">
                <h1>Settings</h1>
                <p>Manage your school settings</p>
            </div>
        </div>
        
        <div style="max-width: 800px;">
            <!-- School Information -->
            <div class="glass" style="padding: 25px; margin-bottom: 20px;">
                <h3 style="color: #d4af37;"><i class="fas fa-school"></i> School Information</h3>
                <form onsubmit="saveSchoolInfo(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>School Name</label>
                            <input type="text" id="schoolNameInput" required>
                        </div>
                        <div class="form-group">
                            <label>Address</label>
                            <input type="text" id="schoolAddress">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Admin Name</label>
                            <input type="text" id="adminName">
                        </div>
                        <div class="form-group">
                            <label>Admin Email</label>
                            <input type="email" id="adminEmail">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>School Motto</label>
                        <input type="text" id="schoolMotto" placeholder="e.g., Strive for Excellence">
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
                </form>
            </div>
            
            <!-- Library Settings -->
            <div class="glass" style="padding: 25px; margin-bottom: 20px;">
                <h3 style="color: #d4af37;"><i class="fas fa-book"></i> Library Settings</h3>
                <form onsubmit="saveSettings(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Max Borrow Days</label>
                            <input type="number" id="maxBorrowDays" min="1" max="30" value="14">
                        </div>
                        <div class="form-group">
                            <label>Max Books Per Student</label>
                            <input type="number" id="maxBooksPerStudent" min="1" max="10" value="3">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Fine Per Day (KES)</label>
                        <input type="number" id="finePerDay" min="0" value="10">
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Settings</button>
                </form>
            </div>
            
            <!-- User Management -->
            <div class="glass" style="padding: 25px; margin-bottom: 20px;">
                <h3 style="color: #d4af37;"><i class="fas fa-users"></i> User Management</h3>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="usersTableBody"></tbody>
                    </table>
                </div>
                <button class="btn btn-primary" onclick="openModal('addUserModal')">
                    <i class="fas fa-user-plus"></i> Add User
                </button>
            </div>
            
            <!-- Data Management -->
            <div class="glass" style="padding: 25px; margin-bottom: 20px;">
                <h3 style="color: #d4af37;"><i class="fas fa-database"></i> Data Management</h3>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="btn btn-secondary" onclick="exportData()"><i class="fas fa-download"></i> Export Data</button>
                    <button class="btn btn-danger" onclick="clearAllData()"><i class="fas fa-trash"></i> Clear All Data</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add User Modal -->
    <div class="modal" id="addUserModal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2><i class="fas fa-user-plus"></i> Add New User</h2>
                <button class="modal-close" onclick="closeModal('addUserModal')"><i class="fas fa-times"></i></button>
            </div>
            <form onsubmit="addUser(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="newUserName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="newUserEmail" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Role</label>
                        <select id="newUserRole">
                            <option value="teacher">Teacher</option>
                            <option value="librarian">Librarian</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="newUserPassword" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-plus"></i> Add User</button>
            </form>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/wallpaper-loader.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        function exportData() {
            showNotification('Data exported!', 'success');
        }
        
        function clearAllData() {
            if (confirm('Are you sure? This cannot be undone!')) {
                showNotification('All data cleared!', 'warning');
            }
        }
    </script>
</body>
</html>
