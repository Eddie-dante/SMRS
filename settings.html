<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRMS - Settings</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="fas fa-school"></i>
                <span>SRMS</span>
            </div>
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a href="library.html" class="nav-item">
                <i class="fas fa-book"></i>
                <span>Library</span>
            </a>
            <a href="students.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span>Students</span>
            </a>
            <a href="furniture.html" class="nav-item">
                <i class="fas fa-chair"></i>
                <span>Furniture</span>
            </a>
            <a href="reports.html" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Reports</span>
            </a>
            <a href="settings.html" class="nav-item active">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-details">
                    <div class="user-name" id="userName">User</div>
                    <div class="user-role" id="userRole">Role</div>
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <h1>Settings</h1>
                <p class="date-display" id="dateDisplay"></p>
            </div>
        </div>
        
        <!-- Settings Sections -->
        <div class="settings-container">
            <!-- School Information -->
            <div class="settings-section glass">
                <h2><i class="fas fa-school"></i> School Information</h2>
                <form id="schoolInfoForm" onsubmit="saveSchoolInfo(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>School Name</label>
                            <input type="text" id="schoolNameInput" required>
                        </div>
                        <div class="form-group">
                            <label>Address</label>
                            <input type="text" id="schoolAddress">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Admin Name</label>
                            <input type="text" id="adminName">
                        </div>
                        <div class="form-group">
                            <label>Admin Email</label>
                            <input type="email" id="adminEmail">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>School Motto</label>
                        <input type="text" id="schoolMotto" placeholder="e.g., Strive for Excellence">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Information
                    </button>
                </form>
            </div>
            
            <!-- Library Settings -->
            <div class="settings-section glass">
                <h2><i class="fas fa-book"></i> Library Settings</h2>
                <form id="librarySettingsForm" onsubmit="saveLibrarySettings(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Max Borrow Days</label>
                            <input type="number" id="maxBorrowDays" min="1" max="30" value="14">
                        </div>
                        <div class="form-group">
                            <label>Max Books Per Student</label>
                            <input type="number" id="maxBooksPerStudent" min="1" max="10" value="3">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Fine Per Day (KES)</label>
                        <input type="number" id="finePerDay" min="0" value="10">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Library Settings
                    </button>
                </form>
            </div>
            
            <!-- User Management -->
            <div class="settings-section glass">
                <h2><i class="fas fa-users"></i> User Management</h2>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Users will be loaded here -->
                        </tbody>
                    </table>
                </div>
                
                <button class="btn btn-primary mt-20" onclick="openAddUserModal()">
                    <i class="fas fa-user-plus"></i> Add User
                </button>
            </div>
            
            <!-- Data Management -->
            <div class="settings-section glass">
                <h2><i class="fas fa-database"></i> Data Management</h2>
                <div class="data-actions">
                    <button class="btn btn-secondary" onclick="exportData()">
                        <i class="fas fa-download"></i> Export All Data
                    </button>
                    <button class="btn btn-danger" onclick="clearAllData()">
                        <i class="fas fa-trash"></i> Clear All Data
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add User Modal -->
    <div class="modal" id="addUserModal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2>Add New User</h2>
                <button class="modal-close" onclick="closeModal('addUserModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="addUserForm" onsubmit="addUser(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="newUserName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="newUserEmail" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Role</label>
                        <select id="newUserRole">
                            <option value="teacher">Teacher</option>
                            <option value="librarian">Librarian</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="newUserPassword" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-plus"></i> Add User
                </button>
            </form>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
